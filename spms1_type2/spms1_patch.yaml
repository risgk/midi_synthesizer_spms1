  # (CC 23), or the depth of what it modulates, sets how much is heard. Color crossfades Out from
  # the white (0.0) to the red (1.0), on CC 115, and powers up at CC 4, 0.0, the white.
  - { entry: 34, module: NOISE_1,   key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  - { entry: 35, module: NOISE_1,   key: COLOR,        label: Color,        cc: 115, value: 4, set: set_color }
  # Mixer 2, the audio ahead of the filter: Osc 1 on In 1, Osc 2 on In 2 and the noise on In 3.
  # Level 1 (CC 116) powers up at 1.0, passing Osc 1 as it is, and Level 2 and 3 (CC 21 and 23) at
  # 0.0, leaving Osc 2 and the noise, at full level from Noise 1, silent. Out Pol holds +0.5,
  # the sum as it is, with no CC.
  - { entry: 36, module: MIXER_2,   key: LEVEL_1,      label: Level 1,      cc: 116, value: 124, set: set_level_1 }
