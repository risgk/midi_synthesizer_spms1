  - { entry: 19, module: LFO_1,     key: RESET_SW,     label: Reset Switch, cc: 111, value: 4, hint: Off/On, set: set_reset_switch }
  # Mixer 1: nothing has a CC; the levels hold 0.0, as the mixer has nothing on its inputs yet,
  # and Out Level holds 0.5, as Mixer 2's powers up.
  - { entry: 20, module: MIXER_1,   key: LEVEL_1,      label: Level 1,      cc: 0,   value: 4, hint_inputs: [IN_1], set: set_level_1 }
  - { entry: 21, module: MIXER_1,   key: LEVEL_2,      label: Level 2,      cc: 0,   value: 4, hint_inputs: [IN_2], set: set_level_2 }
  - { entry: 22, module: MIXER_1,   key: LEVEL_3,      label: Level 3,      cc: 0,   value: 4, hint_inputs: [IN_3], set: set_level_3 }
  - { entry: 23, module: MIXER_1,   key: LEVEL_4,      label: Level 4,      cc: 0,   value: 4, hint_inputs: [IN_4], set: set_level_4 }
  - { entry: 24, module: MIXER_1,   key: OUT_LEVEL,  label: Out Level,  cc: 0,   value: 64, set: set_out_level }
  # Osc 1 in the editor: the waveform and the pulse width, the pitch, how far each modulation
  # moves it and what the top of that is worth, then how far each modulation moves the pulse width. Pitch Coarse
  # and Fine have no CC and stay at 0.0. Mod 1 In takes the envelope and Mod 2 In the LFO, and
  # every depth is unipolar: a modulation runs the way its source does, and one the other way up
  # takes an inverted source, such as EG 1 Out Inv. Pitch Mod 1 Amt and Pitch Mod 2 Amt are on
  # CC 89 and 13, EG Mod Amt's and LFO Mod Amt's in PRA32-U2, and PW Mod 1 Amt and PW Mod 2 Amt
  # on CC 8 and 103, EG Mod Dst's and LFO Mod Dst's. Pitch Mod 2 Amt powers up at CC 124, an
  # octave either way at full LFO level, and the other three at CC 4, 0.0. Pitch Mod Range has no CC and holds 0.2, the depth at the top
  # of a Pitch Mod Amt, which brings the LFO down to a vibrato depth and the envelope to two
  # octaves; a step of a Pitch Mod Amt is then 10 cents of the LFO. Wave is on
  # CC 102 and powers up at the saw. PW is bipolar and powers up at CC 64, 0.0, a pulse of 50%.
  - { entry: 25, module: OSC_1,     key: WAVE,     label: Wave,         cc: 102, value: 4, hint: Saw to Sq, set: set_waveform }
  - { entry: 26, module: OSC_1,     key: PW,           label: PW,  cc: 114, value: 64, bipolar: true, hint: 50% to 0%, set: set_pulse_width }
  - { entry: 27, module: OSC_1,     key: PITCH_COARSE,  label: Pitch Coarse,  cc: 0,   value: 64, bipolar: true, hint: ±5 Oct, set: set_pitch_coarse }
  - { entry: 28, module: OSC_1,     key: PITCH_FINE,    label: Pitch Fine,    cc: 0,   value: 64, bipolar: true, hint: ±60 Cent, set: set_pitch_fine }
  - { entry: 29, module: OSC_1,     key: PITCH_MOD_1_AMT, label: Pitch Mod 1 Amt, cc: 89, value: 4, hint_inputs: [MOD_1], set: set_pitch_modulation_1_amount }
  - { entry: 30, module: OSC_1,     key: PITCH_MOD_2_AMT, label: Pitch Mod 2 Amt, cc: 13, value: 124, hint_inputs: [MOD_2], set: set_pitch_modulation_2_amount }
  - { entry: 31, module: OSC_1,     key: PITCH_MOD_RANGE, label: Pitch Mod Range, cc: 0, value: 28, set: set_pitch_modulation_range }
  - { entry: 32, module: OSC_1,     key: PW_MOD_1_AMT, label: PW Mod 1 Amt,  cc: 8,   value: 4, hint_inputs: [MOD_1], set: set_pw_modulation_1_amount }
  - { entry: 33, module: OSC_1,     key: PW_MOD_2_AMT, label: PW Mod 2 Amt,  cc: 103, value: 4, hint_inputs: [MOD_2], set: set_pw_modulation_2_amount }
  # Osc 2: Pitch Coarse and Fine are its own, on CC 85 and 76, to tune it against Osc 1: Coarse
  # powers up at CC 64, in unison, and Fine at CC 76, 12 cents sharp, for a slow beat once Osc 2
  # is turned up. Wave is its own too, on CC 104 next to Osc 1's on CC 102, sawtooth at power-up as
  # Osc 1's is. Everything else follows Osc 1 by default: each Mod Amt and PW are on Osc 1's CCs,
  # so one CC moves both oscillators, and Pitch Mod Range holds the
  # value Osc 1's does. Osc 2 is heard through Mixer 2 Level 2 (CC 20), which powers up at 0.7, as
  # Level 1 does for Osc 1.
  - { entry: 34, module: OSC_2,     key: WAVE,     label: Wave,         cc: 104, value: 4, hint: Saw to Sq, set: set_waveform }
  - { entry: 35, module: OSC_2,     key: PW,           label: PW,  cc: 114, value: 64, bipolar: true, hint: 50% to 0%, set: set_pulse_width }
  - { entry: 36, module: OSC_2,     key: PITCH_COARSE,  label: Pitch Coarse,  cc: 85,  value: 64, bipolar: true, hint: ±5 Oct, set: set_pitch_coarse }
  - { entry: 37, module: OSC_2,     key: PITCH_FINE,    label: Pitch Fine,    cc: 76,  value: 76, bipolar: true, hint: ±60 Cent, set: set_pitch_fine }
  - { entry: 38, module: OSC_2,     key: PITCH_MOD_1_AMT, label: Pitch Mod 1 Amt, cc: 89, value: 4, hint_inputs: [MOD_1], set: set_pitch_modulation_1_amount }
  - { entry: 39, module: OSC_2,     key: PITCH_MOD_2_AMT, label: Pitch Mod 2 Amt, cc: 13, value: 124, hint_inputs: [MOD_2], set: set_pitch_modulation_2_amount }
  - { entry: 40, module: OSC_2,     key: PITCH_MOD_RANGE, label: Pitch Mod Range, cc: 0, value: 28, set: set_pitch_modulation_range }
  - { entry: 41, module: OSC_2,     key: PW_MOD_1_AMT, label: PW Mod 1 Amt,  cc: 8,   value: 4, hint_inputs: [MOD_1], set: set_pw_modulation_1_amount }
  - { entry: 42, module: OSC_2,     key: PW_MOD_2_AMT, label: PW Mod 2 Amt,  cc: 103, value: 4, hint_inputs: [MOD_2], set: set_pw_modulation_2_amount }
  - { entry: 43, module: OSC_2,     key: SYNC_SW,      label: Sync Switch,  cc: 112, value: 4, hint: Off/On, set: set_sync_switch }
  # Noise 1: Color crossfades Out from the white (0.0) to the red (1.0), on CC 115, and powers up
  # at CC 4, 0.0, the white. Level has no CC and holds 1.0: the noise runs at full level, and
  # Mixer 2 Level 4 (CC 23), or the depth of what it modulates, sets how much is heard.
  - { entry: 44, module: NOISE_1,   key: COLOR,        label: Color,        cc: 115, value: 4, hint: White to Red, set: set_color }
  - { entry: 45, module: NOISE_1,   key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  # Mixer 2, the audio ahead of the filter: Osc 1 on In 1, Osc 2 on In 2, Osc 1's sub on In 3 and
  # the noise on In 4.
  # Level 1 and 2 (CC 19 and 20) power up at CC 88, 0.7: two saws 12 cents apart come out about
  # as loud as one at 1.0, as 0.7 is about one over the square root of 2. Level 3, on CC 21,
  # powers up at 0.0, leaving Osc 1's sub on In 3 silent. Level 4 (CC 23) powers up at 0.0, leaving the noise, at
  # full level from Noise 1, silent. Out Level has no CC and holds 0.5: how
  # hard the sum drives the filter, the one Mixer 2 feeds, and what keeps two oscillators and the
  # noise all at full level, a sum of 1.5 at most, inside the mixer's range.
  - { entry: 46, module: MIXER_2,   key: LEVEL_1,      label: Level 1,      cc: 19,  value: 88, hint_inputs: [IN_1], set: set_level_1 }
  - { entry: 47, module: MIXER_2,   key: LEVEL_2,      label: Level 2,      cc: 20,  value: 88, hint_inputs: [IN_2], set: set_level_2 }
  - { entry: 48, module: MIXER_2,   key: LEVEL_3,      label: Level 3,      cc: 21,  value: 4, hint_inputs: [IN_3], set: set_level_3 }
  - { entry: 49, module: MIXER_2,   key: LEVEL_4,      label: Level 4,      cc: 23,  value: 4, hint_inputs: [IN_4], set: set_level_4 }
  - { entry: 50, module: MIXER_2,   key: OUT_LEVEL,  label: Out Level,  cc: 0,   value: 64, set: set_out_level }
  # Filter 1 in the editor: the cutoff, the resonance and Mode, then the cutoff's keyboard
  # tracking, its two modulations and their polarity. Pitch In takes the pitch from Pitch 1, as Osc 1 Pitch In
  # does, and Pitch Amt (CC 9) at its top makes the cutoff follow the note a semitone for a
  # semitone, unmoved at note 60; it powers up at CC 4, 0.0, with the tracking off. Mod 1 Amt and
  # Mod 2 Amt, on CC 24 and 25, Filter EG Amt's and LFO Filter Amt's in PRA32-U2, are how far the
  # envelope on Mod 1 In and the LFO on Mod 2 In move the cutoff, as Osc 1's PW Mod Amts are for
  # the pulse width. Both power up at CC 4, 0.0, so neither moves the cutoff until it is turned
  # up. Cutoff powers up at CC 112, 0.9. Mod Polarity, on CC 51, sets the sign and the depth of
  # both modulations at once, from -1.0 at CC 4 through none at CC 64 to +1.0 at CC 124; it
  # powers up at CC 124, so the two move the cutoff as their Amts say, and turned below CC 64 it
  # makes the envelope close the filter. Mode crossfades Out from the low pass (0.0) through a
  # notch (0.5) to the high pass (1.0), on CC 39, Filter Mode's in PRA32-U2, and powers up at CC 4,
  # 0.0, the low pass.
  - { entry: 51, module: FILTER_1,  key: CUTOFF,       label: Cutoff,       cc: 74,  value: 112, set: set_cutoff }
  - { entry: 52, module: FILTER_1,  key: RESONANCE,    label: Resonance,    cc: 71,  value: 64, set: set_resonance }
  - { entry: 53, module: FILTER_1,  key: MODE,         label: Mode,         cc: 39,  value: 4, hint: LP to Notch to HP, set: set_mode }
  - { entry: 54, module: FILTER_1,  key: PITCH_AMT, label: Pitch Amt, cc: 9, value: 4, hint_inputs: [PITCH], set: set_pitch_amount }
  - { entry: 55, module: FILTER_1,  key: MOD_1_AMT,    label: Mod 1 Amt,    cc: 24,  value: 4, hint_inputs: [MOD_1], set: set_modulation_1_amount }
  - { entry: 56, module: FILTER_1,  key: MOD_2_AMT,    label: Mod 2 Amt,    cc: 25,  value: 4, hint_inputs: [MOD_2], set: set_modulation_2_amount }
  - { entry: 57, module: FILTER_1,  key: MOD_POLARITY, label: Mod Polarity, cc: 51,  value: 124, bipolar: true, hint: − to +, set: set_modulation_polarity }
  # Amp 1: Gain, on CC 15, Amp Gain's in PRA32-U2, is doubled, so it powers up at CC 64, a gain of
  # 1.0, and CC 124 brings the sound up by 6 dB; the amp holds its output to one unit. Mod 1/2
  # Mix, on CC 36, crossfades what scales the gain from Mod 1 In, the note's gate, at 0.0 (CC 4) to Mod 2
  # In, the envelope, at 1.0 (CC 124), where it powers up, so the envelope shapes the note.
  - { entry: 58, module: AMP_1,     key: GAIN,         label: Gain,         cc: 15,  value: 64, set: set_gain }
  - { entry: 59, module: AMP_1,     key: MOD_1_2_MIX,  label: Mod 1/2 Mix,  cc: 36,  value: 4, hint_inputs: [MOD_1, MOD_2], set: set_modulation_mix }
  - { entry: 60, module: CHORUS_1,  key: MIX,          label: Mix,          cc: 93,  value: 64, set: set_mix }
  - { entry: 61, module: CHORUS_1,  key: RATE,         label: Rate,         cc: 58,  value: 64, set: set_rate }
  - { entry: 62, module: CHORUS_1,  key: DEPTH,        label: Depth,        cc: 59,  value: 64, set: set_depth }
