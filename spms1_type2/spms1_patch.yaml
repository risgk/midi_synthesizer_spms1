# Controls, listed in the editor's order, each by its entry: a parameter is one entry of NRPN
# category 2 (where it takes its value), the same entry of category 3 (which CC fills its control
# slot) and of category 4 (what its control slot holds while it has no CC); a controller control,
# the mod wheel or a general control, is in category 3 only. `cc` is the CC of the default patch, 0 for none, and `value`, as a CC value,
# what that CC powers up at; a parameter's category 4 entry powers up at it too, and the editor's
# Initialize Values sets both back to it. A parameter takes its own control slot, off the
# bus, unless `source` (a signal key) says otherwise. `set` is the method of the module that
# takes a parameter's value each buffer. `hint` is what the editor puts in parentheses after the
# name; `hint_inputs`, inputs of the same module, puts what feeds them there instead, joined by
# "to", following the patch's routing. `favorite` marks a parameter as a favorite in the
# editor's default patch. Why the defaults are what they are is above default_order.
controls:
  # Pitch 1: Glide is on CC 5, Portamento Time in the MIDI spec, and powers up at CC 4, 0.0, where
  # the portamento is off. Out 1 Glide Sw and Out 2 Glide Sw, both on CC 34, power up on,
  # at CC 124, so Glide alone sets the portamento of both outputs unless a switch is set off, below
  # CC 64. Bend Amt, on CC 57, is the bend range, half a semitone a step, and powers up at CC 28,
  # an octave either way. Out 1 Bend Sw and Out 2 Bend Sw have no CC and hold on, so both
  # outputs are bent. Stretch, last as it widens what the others make, is on CC 22 and powers up
  # at CC 4, 0.0, where the keys are as they are.
  - { entry: 0, module: PITCH_1,   key: GLIDE,        label: Glide,        cc: 5, value: 4, favorite: true, set: set_glide }
  - { entry: 1, module: PITCH_1,   key: OUT_1_GLIDE_SW, label: Out 1 Glide Sw, cc: 34, value: 124, hint: Off/On, set: set_glide_1_switch }
  - { entry: 2, module: PITCH_1,   key: OUT_2_GLIDE_SW, label: Out 2 Glide Sw, cc: 34, value: 124, hint: Off/On, set: set_glide_2_switch }
  - { entry: 3, module: PITCH_1,    key: BEND_AMT,  label: Bend Amt,   cc: 57,  value: 28, hint: Bend Range, set: set_bend_amount }
  - { entry: 4, module: PITCH_1,   key: OUT_1_BEND_SW, label: Out 1 Bend Sw, cc: 0, value: 124, hint: Off/On, set: set_bend_1_switch }
  - { entry: 5, module: PITCH_1,   key: OUT_2_BEND_SW, label: Out 2 Bend Sw, cc: 0, value: 124, hint: Off/On, set: set_bend_2_switch }
  - { entry: 6, module: PITCH_1,    key: STRETCH, label: Stretch, cc: 22,  value: 4, hint: x1 to x2, set: set_stretch }
  # EG 1: Attack, Decay and Sustain, on CC 73, 75 and 30, power up at 0.0, 0.7 and 1.0: it opens at
  # once and holds while the key is down, and lets go in about 1.3 s. Release Sw, on CC 105, powers up on, at CC 124, the release following the decay;
  # below CC 64 the release is the shortest decay's, 10 ms. Level has no CC and holds 1.0,
  # passing the envelope as it is.
  - { entry: 7, module: EG_1,      key: ATTACK,       label: Attack,       cc: 73,  value: 4, hint: Time, favorite: true, set: set_attack }
  - { entry: 8, module: EG_1,      key: DECAY,        label: Decay,        cc: 75,  value: 88,  hint: Time, favorite: true, set: set_decay }
  - { entry: 9, module: EG_1,      key: SUSTAIN,      label: Sustain,      cc: 30,  value: 124, hint: Level, favorite: true, set: set_sustain }
  - { entry: 10, module: EG_1,      key: RELEASE_SW,   label: Release Sw, cc: 105, value: 124, hint: Off/On, set: set_release_switch }
  - { entry: 11, module: EG_1,      key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  # EG 2, for the amp, an organ's envelope at power-up: Attack, Decay and Sustain on CC 52, 53 and
  # 54, at CC 4, 4 and 124, so it opens at once and holds while a key
  # is held. Release Sw is on EG 1's CC 105, one switch for both envelopes, and
  # powers up on, so the release is the decay's, 10 ms. Level has no CC and holds 1.0.
  - { entry: 12, module: EG_2,      key: ATTACK,       label: Attack,       cc: 52,  value: 4, hint: Time, set: set_attack }
  - { entry: 13, module: EG_2,      key: DECAY,        label: Decay,        cc: 53,  value: 4, hint: Time, set: set_decay }
  - { entry: 14, module: EG_2,      key: SUSTAIN,      label: Sustain,      cc: 54,  value: 124, hint: Level, set: set_sustain }
  - { entry: 15, module: EG_2,      key: RELEASE_SW,   label: Release Sw, cc: 105, value: 124, hint: Off/On, set: set_release_switch }
  - { entry: 16, module: EG_2,      key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  # LFO 1 in the editor: the waveform, the rate and the level, then the modulation of each, then
  # Reset Sw, on CC 113, which powers up off, at CC 4, so Reset In, Note Gate, is ignored until it
  # is turned on. Wave
  # crossfades Out from the triangle (0.0) to the square (1.0), on CC 33,
  # and powers up at CC 4, 0.0, the triangle. Each modulation's Amt, listed in the order of what
  # it moves, has no CC and holds 1.0, a depth of 1.0. Rate Mod In is left unrouted, so
  # routing a source to it is enough; Level Mod In takes the mod wheel, which adds to Level
  # (CC 116) up to its top. Level powers up at CC 124, 1.0, so the LFO runs at full level, and
  # what it moves sets the depth.
  - { entry: 17, module: LFO_1,     key: WAVE,         label: Wave,         cc: 33,  value: 4, hint: Tri to Sq, set: set_wave }
  - { entry: 18, module: LFO_1,     key: RATE,         label: Rate,         cc: 3,   value: 64, favorite: true, set: set_rate }
  - { entry: 19, module: LFO_1,     key: LEVEL,        label: Level,        cc: 116, value: 124, set: set_level }
  - { entry: 20, module: LFO_1,     key: RATE_MOD_AMT, label: Rate Mod Amt, cc: 0,   value: 124, hint_inputs: [RATE_MOD_IN], set: set_rate_modulation_amount }
  - { entry: 21, module: LFO_1,     key: LEVEL_MOD_AMT, label: Level Mod Amt, cc: 0,  value: 124, hint_inputs: [LEVEL_MOD_IN], set: set_level_modulation_amount }
  - { entry: 22, module: LFO_1,     key: RESET_SW,     label: Reset Sw, cc: 113, value: 4, hint: Off/On, set: set_reset_switch }
