  - { entry: 65, module: MIXER_2,   key: OUT_LEVEL,  label: Out Level,  cc: 0,   value: 64, set: set_out_level }
  # Filter 1 in the editor: the cutoff, the resonance and Mode, then the cutoff's keyboard
  # tracking, its two modulations and their polarity. Pitch In takes the pitch from Pitch 1, as Osc 1 Pitch In
  # does, and Pitch Amt (CC 9) at its top makes the cutoff follow the note a semitone for a
  # semitone, unmoved at note 60; it powers up at CC 4, 0.0, with the cutoff not following the note. Mod 1 Amt and
  # Mod 2 Amt, on CC 24 and 25, are how far the
  # envelope on Mod 1 In and the LFO on Mod 2 In move the cutoff, as Osc 1's PW Mod Amts are for
  # the pulse width. Mod 1 Amt powers up at CC 28, 0.2, the envelope opening the cutoff two
  # octaves, and Mod 2 Amt at CC 4, 0.0, the LFO leaving it alone until it is turned up. Cutoff
  # powers up at CC 100, 0.8. Mod 1 Pol and Mod 2 Pol set the sign and the
  # depth of each modulation, from -1.0 at CC 4 through none at CC 64 to +1.0 at CC 124. Mod 1
  # Pol, on CC 117, powers up at CC 124, so the envelope moves the cutoff as Mod 1 Amt says,
  # and turned below CC 64 it makes the envelope close the filter. Mod 2 Pol has no CC and
  # powers up at CC 76, +0.2, so Mod 2 Amt at its top swings the cutoff an octave either way with
  # the LFO, a vibrato's depth for a filter. Mode crossfades Out from the low pass (0.0) through a
  # notch (0.5) to the high pass (1.0), on CC 39, and powers up at CC 4,
  # 0.0, the low pass.
  - { entry: 66, module: FILTER_1,  key: CUTOFF,       label: Cutoff,       cc: 74,  value: 100, favorite: true, set: set_cutoff }
  - { entry: 67, module: FILTER_1,  key: RESONANCE,    label: Resonance,    cc: 71,  value: 64, favorite: true, set: set_resonance }
  - { entry: 68, module: FILTER_1,  key: MODE,         label: Mode,         cc: 39,  value: 4, hint: LP to Notch to HP, set: set_mode }
  - { entry: 69, module: FILTER_1,  key: PITCH_AMT, label: Pitch Amt, cc: 9, value: 4, hint_inputs: [PITCH_IN], set: set_pitch_amount }
  - { entry: 70, module: FILTER_1,  key: MOD_1_AMT,    label: Mod 1 Amt,    cc: 24,  value: 28, hint_inputs: [MOD_1_IN], favorite: true, set: set_modulation_1_amount }
  - { entry: 71, module: FILTER_1,  key: MOD_1_POL,      label: Mod 1 Pol, cc: 117, value: 124, bipolar: true, hint: − to +, set: set_modulation_1_polarity }
  - { entry: 72, module: FILTER_1,  key: MOD_2_AMT,    label: Mod 2 Amt,    cc: 25,  value: 4, hint_inputs: [MOD_2_IN], favorite: true, set: set_modulation_2_amount }
  - { entry: 73, module: FILTER_1,  key: MOD_2_POL,      label: Mod 2 Pol, cc: 0,   value: 76, bipolar: true, hint: − to +, set: set_modulation_2_polarity }
  # Amp 1: Gain, on CC 15, is squared and taken four times, a gain of 1.0 at CC 64 and 4.0, 12 dB
  # up, at CC 124. It powers up at CC 88, 0.7, a gain of 1.96, 5.8 dB up, which brings the default
  # patch's peaks to about -5 dBFS, under the limiter with either oscillator wave; its Limiter Sw, below, holds what goes past 0.9 under the amp's one-unit
  # clamp, so that a higher gain or a louder sound reaches it rounded off rather than cut. Mod 1/2
  # Mix, on CC 36, crossfades what scales the gain from Mod 1 In, EG 1, at 0.0 (CC 4), where it
