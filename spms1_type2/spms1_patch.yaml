# MIDI Synthesizer SPMS-1 (type-2): the patch, as data
#
# Every number a patch is made of -- module ids, bus slots, NRPN entries -- and the default patch,
# in one place. patch_gen/spms1_patch_gen.rb writes what the rest of the sketch reads from here:
#
#   spms1/spms1_patch.rb  the constants and the default patch, for spms1_main.rb
#   spms1_editor.html     the tables of the editor, between its "patch_gen" markers
#   README.md             the NRPN tables, between the "patch_gen" markers, and README.ja.md likewise
#   spms1/spms1_main.rb   the wiring of the loop, between its "patch_gen" markers: the module
#                         instances, the routing and CC reads, the setters and the dispatch
#
# Run `ruby patch_gen/spms1_patch_gen.rb` after a change here, and commit what it writes;
# `--check` says whether that is needed, as the GitHub Actions workflow does.
#
# Every list is numbered in its order, from 0 (from 1 for the modules), with no gaps, which
# patch_gen checks: the modules in the default run order; on the bus the constants, then what
# comes from MIDI, then each module's outputs, module by module in that order, its main output
# first; the inputs and the controls module by module in the same order, the final output's sides
# last among the inputs and the mod wheel last among the controls. Something added goes
# where it belongs and the numbers after it move up, so a patch sent as NRPN bytes, which names
# everything by number, is for the version it was made for; the editor saves a patch by name and
# reads it into any version. Each number is still written out, so that a renumbering shows;
# `ruby patch_gen/spms1_patch_gen.rb --renumber` writes them again from the order of the lists.
#
# Labels: `label` is what the README and the editor call a thing. Where the Japanese README calls
# it otherwise, `label_ja` says so.

# Module ids (NRPN category 0 values). 0 is MODULE_NONE, which ends the run order. A module with
# `stereo` writes a left and a right output. `class` is the Ruby class of the module, and `process`
# the inputs its process method takes after the control tick, in order, by their keys below; the
# loop is written from these (see patch_gen/spms1_patch_gen.rb).
modules:
  - { key: PITCH_1,    id: 1, label: Pitch 1, class: Pitch, process: [PITCH, BEND] }
  - { key: EG_1, id: 2, label: EG 1, class: EnvGen, process: [GATE] }
  - { key: EG_2, id: 3, label: EG 2, class: EnvGen, process: [GATE] }
  - { key: LFO_1,     id: 4, label: LFO 1, class: LFO, process: [RATE_MOD, LEVEL_MOD, RESET] }
  - { key: MIXER_1,   id: 5, label: Mixer 1, class: Mixer, process: [IN_1, IN_2, IN_3, IN_4] }
  - { key: OSC_1,     id: 6, label: Osc 1, class: Osc, process: [PITCH, MOD_1, MOD_2] }
  - { key: OSC_2,      id: 7, label: Osc 2, class: Osc, method: process_synced, process: [PITCH, MOD_1, MOD_2, SYNC] }
  - { key: NOISE_1,    id: 8, label: Noise 1, class: Noise, process: [] }
  - { key: MIXER_2,    id: 9, label: Mixer 2, class: Mixer, process: [IN_1, IN_2, IN_3, IN_4] }
  - { key: FILTER_1,  id: 10, label: Filter 1, class: Filter, process: [AUDIO, PITCH, MOD_1, MOD_2] }
  - { key: AMP_1,     id: 11, label: Amp 1, class: Amp, process: [AUDIO, MOD_1, MOD_2] }
  - { key: CHORUS_1,  id: 12, label: Chorus 1, stereo: true, class: Chorus, process: [AUDIO] }
  - { key: DELAY_1,   id: 13, label: Delay 1,  stereo: true, class: Delay, process: [AUDIO_L, AUDIO_R] }

# The default patch. Every module is in the run order, so a patch only ever has to route, never to
# switch something on first. Pitch 1 runs first, taking Note Pitch and handing it to the
# oscillator: its Glide powers up at 0.0, where it passes its input through as it
# is, so the patch plays as one without it until CC 5 turns the portamento up. Pitch Bend goes to
# its Bend In, added past the glide, an octave either way at Bend Amt's (CC 57) power-up of CC 28, so
# the bend reaches the oscillator and the filter's keyboard tracking at once. Running first lets
# every other module read it in the same sample, the modulation sources as well as the
# oscillators and the filter, as a key-tracked envelope or LFO would; what it takes from them
# instead comes a sample late. Mixer 1 runs after the modulation sources and ahead of the oscillators, so
# it sees this sample's LFO and envelope and can feed the oscillators, the filter and the amp
# without a sample's delay. The default patch leaves it unused: the LFO goes straight to the
# oscillator, on Mod 2 In: Pitch Mod 2 Amt (CC 13) powers up at its top, which with Osc 1 Pitch
# Mod Range at 0.2 makes the LFO at full level swing the pitch an octave either way. The LFO
# itself powers up at Level 0.0, so the swing is the mod wheel's, from none to an octave. PW Mod 2 Amt, on CC 103,
# takes the LFO to the pulse width and powers up at 0.0. Osc 1 Pitch In takes the note from
# Pitch 1 whole, in tune. Osc 1 Mod 1 In takes the envelope, for a pitch envelope, but Pitch Mod 1
# Amt (CC 89) and PW Mod 1 Amt (CC 8) power up at 0.0 too. The envelope and the LFO also reach
# Filter 1 Mod 1 In and Mod 2 In, but Filter 1 Mod 1 Amt and Mod 2 Amt power up at 0.0, so the
# cutoff stays where Cutoff (CC 74), at 0.9, puts it until CC 24 or 25 turns one up.
# Filter 1 Pitch In takes Pitch 1's pitch too, for keyboard tracking, but Filter 1 Pitch Amt
# powers up at 0.0 and leaves it off until CC 9. Noise 1 runs after the oscillators, as it is mostly a sound of its own (a modulation taking
# it is a sample late, which it does not hear), at full level: its Level has no CC and holds 1.0.
# Mixer 2 runs after it, just ahead of the filter, which it feeds: Osc 1 on its In 1, Osc 2 on In 2,
# Osc 1's sub on In 3 and the noise on In 4. Its Level 1 and 2, on CC 19 and 20, power up at 0.7,
# so the two oscillators sound together about as loud as one at full level, and Level 4, on CC 23,
# at 0.0, so the noise is silent until CC 23. Osc 2 plays the note from Pitch 1, as Osc 1 does, tuned by its own
# Pitch Coarse and Fine (CC 85 and 76), 12 cents sharp at power-up, and has a Wave of its own on CC
# 104 (Osc 1's on CC 102); it follows Osc 1 in everything else: each of its Mod Amts and its PW
# are on Osc 1's CCs, so one CC moves both. Osc 2 Sync In takes Osc 1 Out Saw, for hard sync, but
# Osc 2 Sync Switch, on CC 112, powers up off, so it runs free until CC 112; LFO 1 Reset In takes
# Note Gate, for key sync, but LFO 1 Reset Switch, on CC 111, powers up off, so the LFO runs free
# too until CC 111. Mixer 1 has no CC, its levels holding 0.0, so its
# inputs start closed, and Mixer 2 Level 3, on CC 21, powers up at 0.0. Each mixer's Out Level has no
# CC and holds 0.5, which keeps two full-scale signals and a third at half inside its range;
# Mixer 2's also sets how hard the audio drives the filter. EG 2, on Note Gate too, is an organ's
# envelope at power-up, Attack and Decay at 0.0 and Sustain at 1.0 (CC 52, 53 and 54), its Release
# Switch on EG 1's CC 105: Amp 1 Mod 1 In takes EG 1 and Mod 2 In EG 2, and Mod 1/2 Mix (CC 36)
# powers up at 0.0, so the amp follows EG 1 until CC 36 hands it to EG 2. EG 1, EG 2, LFO 1 and
# the mixers each put out an inverted output as well, Out Inv, which the default patch leaves
# unrouted. LFO 1 Level is on
# CC 113 and powers up at 0.0, and the mod wheel on its Level Mod In adds to it up to 1.0; EG 1
# Level has no CC and holds 1.0, passing the envelope as it is. The chorus and the delay run last,
# after the amp: the chorus takes the mono amp and spreads it into a left and a right, the delay
# takes the two sides, and its two outputs are what the final output's left and right read.
#
# The run order of the default patch, the order of the module ids too. Pitch 1 runs first, so that
# everything after it reads the note in the same sample, and the envelopes ahead of the LFO, so that
# the LFO's Mod Ins can read it in the same sample, as for a vibrato that fades in.
default_order: [PITCH_1, EG_1, EG_2, LFO_1, MIXER_1, OSC_1, OSC_2, NOISE_1, MIXER_2, FILTER_1, AMP_1, CHORUS_1, DELAY_1]

# Slots of the signal bus (the values of NRPN categories 1 and 2), each one of:
#   value:    a constant, which the bus holds from startup; `short` is the editor's label for it
#   output:   a module output, `module` writing it, `output` its label on the module in the editor;
#             `get` the method that reads it after process, or none for the one process returns
#   control:  a controller's slot, the mod wheel's, which the CC of that control (below) fills
#   (none):   a note input, written by the synth from MIDI
# `bipolar` marks a slot that swings both ways (the README's ±); a controller slot takes its
# control's.
#
# 127 is not a slot: as a parameter's source it means the parameter's own control slot, which
# holds the value of its CC off the bus (see spms1_main.rb), so no other input or parameter can
# read it.
signals:
  # The constants, from the top down. NONE is 0, what an NRPN entry nobody has set reads, so that
  # an unrouted input is silent.
  - { key: NONE,            id: 0, value: 0.0,  short: "0.0",  label: None (constant 0.0), label_ja: なし（定数 0.0） }
  - { key: ONE,             id: 1, value: 1.0,  short: "+1.0", label: Constant 1.0,  label_ja: 定数 1.0 }
  - { key: HALF,            id: 2, value: 0.5,  short: "+0.5", label: Constant 0.5,  label_ja: 定数 0.5 }
  - { key: MINUS_HALF,      id: 3, value: -0.5, short: "-0.5", label: Constant -0.5, label_ja: 定数 -0.5 }
  - { key: MINUS_ONE,       id: 4, value: -1.0, short: "-1.0", label: Constant -1.0, label_ja: 定数 -1.0 }

  # From MIDI: the note, the bend and the mod wheel.
  - { key: NOTE_PITCH, id: 5, label: Note Pitch, bipolar: true }
  - { key: NOTE_GATE,  id: 6, label: Note Gate }
  - { key: PITCH_BEND, id: 7, label: Pitch Bend, bipolar: true }
  # The mod wheel, a control slot no parameter owns: its CC put on the bus, unipolar, for any
  # input or parameter to read.
  - { key: MOD_WHEEL,  id: 8, control: MOD_WHEEL }

  # The module outputs, module by module, each module's main output first.
  - { key: PITCH_1_OUTPUT, id: 9, module: PITCH_1, output: Out, label: Pitch 1 Output, bipolar: true }
  - { key: EG_1_OUTPUT,        id: 10, module: EG_1,     output: Out,    label: EG 1 Output }
  # Out Inv, of the envelope, the LFO and the mixers, is Out negated.
  - { key: EG_1_OUTPUT_INV,    id: 11, module: EG_1,     output: Out Inv, label: EG 1 Output Inv, get: output_inverted }
  - { key: EG_2_OUTPUT,        id: 12, module: EG_2,     output: Out,    label: EG 2 Output }
  - { key: EG_2_OUTPUT_INV,    id: 13, module: EG_2,     output: Out Inv, label: EG 2 Output Inv, get: output_inverted }
  # Out is the triangle and the square crossfaded by Wave; each of the three has its inverted output
  # beside it. The square is unipolar, 0.0 and 1.0, and its inverted output 0.0 and -1.0.
  - { key: LFO_1_OUTPUT,       id: 14, module: LFO_1,    output: Out,    label: LFO 1 Output,       bipolar: true }
  - { key: LFO_1_OUTPUT_INV,   id: 15, module: LFO_1,    output: Out Inv, label: LFO 1 Output Inv,  bipolar: true, get: output_inverted }
  - { key: LFO_1_OUTPUT_TRIANGLE, id: 16, module: LFO_1, output: Out Triangle, label: LFO 1 Output Triangle, bipolar: true, get: output_triangle }
  - { key: LFO_1_OUTPUT_TRIANGLE_INV, id: 17, module: LFO_1, output: Out Triangle Inv, label: LFO 1 Output Triangle Inv, bipolar: true, get: output_triangle_inverted }
  - { key: LFO_1_OUTPUT_SQUARE,   id: 18, module: LFO_1, output: Out Square,   label: LFO 1 Output Square,   get: output_square }
  - { key: LFO_1_OUTPUT_SQUARE_INV, id: 19, module: LFO_1, output: Out Square Inv, label: LFO 1 Output Square Inv, get: output_square_inverted }
  - { key: MIXER_1_OUTPUT,     id: 20, module: MIXER_1,  output: Out,    label: Mixer 1 Output,     bipolar: true }
  - { key: MIXER_1_OUTPUT_INV,   id: 21, module: MIXER_1,  output: Out Inv, label: Mixer 1 Output Inv, bipolar: true, get: output_inverted }
  # Each oscillator's Out is the morph from the saw to the pulse, by Wave.
  - { key: OSC_1_OUTPUT,       id: 22, module: OSC_1,    output: Out,    label: Osc 1 Output,       bipolar: true }
  - { key: OSC_1_OUTPUT_SAW,   id: 23, module: OSC_1, output: Out Saw,   label: Osc 1 Output Saw,   bipolar: true, get: output_saw }
  - { key: OSC_1_OUTPUT_PULSE, id: 24, module: OSC_1, output: Out Pulse, label: Osc 1 Output Pulse, bipolar: true, get: output_pulse }
  - { key: OSC_1_OUTPUT_SUB,   id: 25, module: OSC_1, output: Out Sub,   label: Osc 1 Output Sub,   bipolar: true, get: output_sub }
  - { key: OSC_2_OUTPUT,         id: 26, module: OSC_2,   output: Out,       label: Osc 2 Output,         bipolar: true }
  - { key: OSC_2_OUTPUT_SAW,   id: 27, module: OSC_2, output: Out Saw,   label: Osc 2 Output Saw,   bipolar: true, get: output_saw }
  - { key: OSC_2_OUTPUT_PULSE, id: 28, module: OSC_2, output: Out Pulse, label: Osc 2 Output Pulse, bipolar: true, get: output_pulse }
  # Out is the white and the red crossfaded by Color.
  - { key: NOISE_1_OUTPUT,       id: 29, module: NOISE_1, output: Out,       label: Noise 1 Output,       bipolar: true }
  - { key: NOISE_1_OUTPUT_WHITE, id: 30, module: NOISE_1, output: Out White, label: Noise 1 Output White, bipolar: true, get: output_white }
  - { key: NOISE_1_OUTPUT_RED,   id: 31, module: NOISE_1, output: Out Red,   label: Noise 1 Output Red,   bipolar: true, get: output_red }
  - { key: MIXER_2_OUTPUT,       id: 32, module: MIXER_2, output: Out,      label: Mixer 2 Output,       bipolar: true }
  - { key: MIXER_2_OUTPUT_INV,   id: 33, module: MIXER_2,  output: Out Inv, label: Mixer 2 Output Inv, bipolar: true, get: output_inverted }
  # Out is the low pass and the high pass crossfaded by Mode, through a notch.
  - { key: FILTER_1_OUTPUT,    id: 34, module: FILTER_1, output: Out,    label: Filter 1 Output,    bipolar: true }
  - { key: FILTER_1_OUTPUT_LP, id: 35, module: FILTER_1, output: Out LP, label: Filter 1 Output LP, bipolar: true, get: output_lp }
  - { key: FILTER_1_OUTPUT_HP, id: 36, module: FILTER_1, output: Out HP, label: Filter 1 Output HP, bipolar: true, get: output_hp }
  - { key: FILTER_1_OUTPUT_BP, id: 37, module: FILTER_1, output: Out BP, label: Filter 1 Output BP, bipolar: true, get: output_bp }
  - { key: AMP_1_OUTPUT,       id: 38, module: AMP_1,    output: Out,    label: Amp 1 Output,       bipolar: true }
  # Out Mono, of the chorus and of the delay, is the average of the two sides, a sub output.
  - { key: CHORUS_1_OUTPUT_L,  id: 39, module: CHORUS_1, output: Out L,  label: Chorus 1 Output L,  bipolar: true, get: output_l }
  - { key: CHORUS_1_OUTPUT_R,  id: 40, module: CHORUS_1, output: Out R,  label: Chorus 1 Output R,  bipolar: true, get: output_r }
  - { key: CHORUS_1_OUTPUT_MONO, id: 41, module: CHORUS_1, output: Out Mono, label: Chorus 1 Output Mono, bipolar: true, get: output_mono }
  - { key: DELAY_1_OUTPUT_L,   id: 42, module: DELAY_1,  output: Out L,  label: Delay 1 Output L,   bipolar: true, get: output_l }
  - { key: DELAY_1_OUTPUT_R,   id: 43, module: DELAY_1,  output: Out R,  label: Delay 1 Output R,   bipolar: true, get: output_r }
  - { key: DELAY_1_OUTPUT_MONO,  id: 44, module: DELAY_1,  output: Out Mono, label: Delay 1 Output Mono,  bipolar: true, get: output_mono }

# Module inputs, NRPN category 1, listed in the editor's order, each by its entry: what feeds each
# one in the default patch (`source`, a signal key). `label` is the editor's, on the module; `name`
# the README's, after the module's label. An input with no module is a side of the final output.
inputs:
  - { entry: 0, module: PITCH_1,      key: PITCH,       label: Pitch In,       name: Pitch In,       source: NOTE_PITCH }
  - { entry: 1, module: PITCH_1,      key: BEND,        label: Bend In,      name: Bend In,      source: PITCH_BEND }
  - { entry: 2, module: EG_1,        key: GATE,        label: Gate In,        name: Gate In,        source: NOTE_GATE }
  - { entry: 3, module: EG_2,        key: GATE,        label: Gate In,        name: Gate In,        source: NOTE_GATE }
  - { entry: 4, module: LFO_1,       key: RATE_MOD,    label: Rate Mod In,    name: Rate Mod In,    source: NONE }
  - { entry: 5, module: LFO_1,       key: LEVEL_MOD,   label: Level Mod In,   name: Level Mod In,   source: MOD_WHEEL }
  - { entry: 6, module: LFO_1,       key: RESET,       label: Reset In,       name: Reset In,       source: NOTE_GATE }
  - { entry: 7, module: MIXER_1,     key: IN_1,        label: In 1,           name: In 1,           source: NONE }
  - { entry: 8, module: MIXER_1,     key: IN_2,        label: In 2,           name: In 2,           source: NONE }
  - { entry: 9, module: MIXER_1,     key: IN_3,        label: In 3,           name: In 3,           source: NONE }
  - { entry: 10, module: MIXER_1,     key: IN_4,        label: In 4,           name: In 4,           source: NONE }
  - { entry: 11, module: OSC_1,       key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 12, module: OSC_1,       key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 13, module: OSC_1,       key: MOD_2,       label: Mod 2 In,   name: Mod 2 In,   source: LFO_1_OUTPUT }
  - { entry: 14, module: OSC_2,       key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 15, module: OSC_2,       key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 16, module: OSC_2,       key: MOD_2,       label: Mod 2 In,       name: Mod 2 In,       source: LFO_1_OUTPUT }
  - { entry: 17, module: OSC_2,       key: SYNC,        label: Sync In,        name: Sync In,        source: OSC_1_OUTPUT_SAW }
  - { entry: 18, module: MIXER_2,     key: IN_1,        label: In 1,           name: In 1,           source: OSC_1_OUTPUT }
  - { entry: 19, module: MIXER_2,     key: IN_2,        label: In 2,           name: In 2,           source: OSC_2_OUTPUT }
  - { entry: 20, module: MIXER_2,     key: IN_3,        label: In 3,           name: In 3,           source: OSC_1_OUTPUT_SUB }
  - { entry: 21, module: MIXER_2,     key: IN_4,        label: In 4,           name: In 4,           source: NOISE_1_OUTPUT }
  - { entry: 22, module: FILTER_1,    key: AUDIO,       label: Audio In,       name: Audio In,       source: MIXER_2_OUTPUT }
  - { entry: 23, module: FILTER_1,    key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 24, module: FILTER_1,    key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 25, module: FILTER_1,    key: MOD_2,       label: Mod 2 In,       name: Mod 2 In,       source: LFO_1_OUTPUT }
  - { entry: 26, module: AMP_1,       key: AUDIO,       label: Audio In,       name: Audio In,       source: FILTER_1_OUTPUT }
  - { entry: 27, module: AMP_1,       key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 28, module: AMP_1,       key: MOD_2,       label: Mod 2 In,       name: Mod 2 In,       source: EG_2_OUTPUT }
  - { entry: 29, module: CHORUS_1,    key: AUDIO,       label: Audio In,       name: Audio In,       source: AMP_1_OUTPUT }
  - { entry: 30, module: DELAY_1,     key: AUDIO_L,     label: Audio In L,     name: Audio In L,     source: CHORUS_1_OUTPUT_L }
  - { entry: 31, module: DELAY_1,     key: AUDIO_R,     label: Audio In R,     name: Audio In R,     source: CHORUS_1_OUTPUT_R }
  - { entry: 32, key: OUTPUT_L,    label: L,              name: Final Output L, name_ja: 最終出力 L, source: DELAY_1_OUTPUT_L }
  - { entry: 33, key: OUTPUT_R,    label: R,              name: Final Output R, name_ja: 最終出力 R, source: DELAY_1_OUTPUT_R }

# Controls, listed in the editor's order, each by its entry: a parameter is one entry of NRPN
# category 2 (where it takes its value), the same entry of category 3 (which CC fills its control
# slot) and of category 4 (what its control slot holds while it has no CC); a controller control,
# the mod wheel, is in category 3 only. `cc` is the CC of the default patch, 0 for none, and `value`, as a CC value,
# what that CC powers up at; a parameter's category 4 entry powers up at it too, and the editor's
# Initialize & Send All sets both back to it. A parameter takes its own control slot, off the
# bus, unless `source` (a signal key) says otherwise. `set` is the method of the module that
# takes a parameter's value each buffer. `hint` is what the editor puts in parentheses after the
# name; `hint_inputs`, inputs of the same module, puts what feeds them there instead, joined by
# "to", following the patch's routing. Why the defaults are what they are is above default_order.
controls:
  # Pitch 1: Glide is on CC 5, Portamento Time in the MIDI spec, and powers up at CC 4, 0.0, where
  # the portamento is off. Glide Switch, on CC 34, powers up on, at CC 124, so Glide alone sets
  # the portamento unless the switch is set off, below CC 64. Bend Amt, on CC 57, is the bend
  # range, half a semitone a step, and powers up at CC 28, an octave either way. Stretch, last as
  # it widens what the others make, is on CC 81 and powers up at CC 4, 0.0, where the keys are as
  # they are.
  - { entry: 0, module: PITCH_1,   key: GLIDE,        label: Glide,        cc: 5, value: 4, set: set_glide }
  - { entry: 1, module: PITCH_1,   key: GLIDE_SW,     label: Glide Switch, cc: 34, value: 124, hint: Off/On, set: set_glide_switch }
  - { entry: 2, module: PITCH_1,    key: BEND_AMT,  label: Bend Amt,   cc: 57,  value: 28, hint: Bend Range, set: set_bend_amount }
  - { entry: 3, module: PITCH_1,    key: STRETCH, label: Stretch, cc: 81,  value: 4, hint: x1 to x2, set: set_stretch }
  # EG 1: Release Switch, on CC 105, powers up on, at CC 124, the release following the decay;
  # below CC 64 the release is the shortest decay's, 10 ms. Level has no CC and holds 1.0,
  # passing the envelope as it is.
  - { entry: 4, module: EG_1,      key: ATTACK,       label: Attack,       cc: 73,  value: 4, hint: Time, set: set_attack }
  - { entry: 5, module: EG_1,      key: DECAY,        label: Decay,        cc: 75,  value: 100, hint: Time, set: set_decay }
  - { entry: 6, module: EG_1,      key: SUSTAIN,      label: Sustain,      cc: 30,  value: 124, hint: Level, set: set_sustain }
  - { entry: 7, module: EG_1,      key: RELEASE_SW,   label: Release Switch, cc: 105, value: 124, hint: Off/On, set: set_release_switch }
  - { entry: 8, module: EG_1,      key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  - { entry: 9, module: EG_2,      key: ATTACK,       label: Attack,       cc: 52,  value: 4, hint: Time, set: set_attack }
  - { entry: 10, module: EG_2,      key: DECAY,        label: Decay,        cc: 53,  value: 4, hint: Time, set: set_decay }
  - { entry: 11, module: EG_2,      key: SUSTAIN,      label: Sustain,      cc: 54,  value: 124, hint: Level, set: set_sustain }
  - { entry: 12, module: EG_2,      key: RELEASE_SW,   label: Release Switch, cc: 105, value: 124, hint: Off/On, set: set_release_switch }
  - { entry: 13, module: EG_2,      key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  # LFO 1 in the editor: the waveform, the rate and the level, then the modulation of each. Wave
  # crossfades Out from the triangle (0.0) to the square (1.0), on CC 33, LFO Wave's in PRA32-U2,
  # and powers up at CC 4, 0.0, the triangle. Each modulation's Amt, listed in the order of what
  # it moves, has no CC and holds 1.0, a depth of 1.0. Rate Mod In is left unrouted, so
  # routing a source to it is enough; Level Mod In takes the mod wheel, which adds to Level
  # (CC 113) up to its top. Level powers up at CC 4, 0.0, so the LFO is still until the wheel
  # moves.
  - { entry: 14, module: LFO_1,     key: WAVE,         label: Wave,         cc: 33,  value: 4, hint: Tri to Sq, set: set_wave }
  - { entry: 15, module: LFO_1,     key: RATE,         label: Rate,         cc: 3,   value: 64, set: set_rate }
