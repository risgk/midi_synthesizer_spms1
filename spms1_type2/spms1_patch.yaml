  # Balance Law came after Noise 1 Color and LFO 1 Wave. It picks how both balances of its mixer
  # crossfade, in five zones, 0.125 wide at the ends and 0.25 between: linear, reserved (as equal
  # power), equal power, overlap and split. It is bipolar only so that its default, equal power, is
  # the centre: it has no CC and reads its own slot, 0.0, on both mixers, and the constants -0.5,
  # -0.2, 0.0, +0.2 and +0.5 pick each law. The edges sit 0.0025 below the zones' own, as the mixer
  # works them out. `zones` names what each range between `zone_edges` picks, and the editor shows
  # the one picked; `hint` is the editor's tooltip for the parameter.
