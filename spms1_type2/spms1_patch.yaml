# MIDI Synthesizer SPMS-1 (type-2): the patch, as data
#
# Every number a patch is made of -- module ids, bus slots, NRPN entries -- and the default patch,
# in one place. patch_gen/spms1_patch_gen.rb writes what the rest of the sketch reads from here:
#
#   spms1/spms1_patch.rb  the constants and the default patch, for spms1_main.rb
#   spms1_editor.html     the tables of the editor, between its "patch_gen" markers
#   README.md             the NRPN tables, between the "patch_gen" markers, and README.ja.md likewise
#   spms1/spms1_main.rb   the module ids and output slots of the dispatch, each literal marked with
#                         its constant's name (`# MODULE_<key>`, `# SIGNAL_<key>`)
#
# Run `ruby patch_gen/spms1_patch_gen.rb` after a change here, and commit what it writes;
# `--check` says whether that is needed, as the GitHub Actions workflow does.
#
# Numbers only ever get added, at the end of their range: a module id after the last, a bus slot
# after the last, an NRPN entry after the last of its category. A patch sent as NRPN bytes names
# everything by number, so one made before keeps meaning the same thing after. Each number is
# written out rather than counted from the order of the list, so a slip is caught rather than
# shifting everything after it.
#
# Labels: `label` is what the README and the editor call a thing. Where the Japanese README calls
# it otherwise, `label_ja` says so.

# Module ids (NRPN category 0 values). 0 is MODULE_NONE, which ends the run order. A module with
# `stereo` writes a left and a right output.
modules:
  - { key: LFO_1,     id: 1, label: LFO 1 }
  - { key: EG_1, id: 2, label: EG 1 }
  - { key: OSC_1,     id: 3, label: Osc 1 }
  - { key: FILTER_1,  id: 4, label: Filter 1 }
  - { key: AMP_1,     id: 5, label: Amp 1 }
  - { key: MIXER_1,   id: 6, label: Mixer 1 }
  - { key: CHORUS_1,  id: 7, label: Chorus 1, stereo: true }
  - { key: DELAY_1,   id: 8, label: Delay 1,  stereo: true }
  - { key: PITCH_1,    id: 9, label: Pitch 1 }
  - { key: NOISE_1,    id: 10, label: Noise 1 }
  - { key: OSC_2,      id: 11, label: Osc 2 }
  - { key: MIXER_2,    id: 12, label: Mixer 2 }

# The run order of the default patch. The envelope runs ahead of the LFO, so that the LFO's Mod Ins
# can read it in the same sample, as for a vibrato that fades in.
default_order: [NOISE_1, EG_1, LFO_1, MIXER_1, PITCH_1, OSC_1, OSC_2, MIXER_2, FILTER_1, AMP_1, CHORUS_1, DELAY_1]

# Slots of the signal bus (the values of NRPN categories 1 and 2), each one of:
#   value:    a constant, which the bus holds from startup; `short` is the editor's label for it
#   output:   a module output, `module` writing it, `output` its label on the module in the editor
#   control:  a General slot, which the CC of that General control (below) fills
#   (none):   a note input, written by the synth from MIDI
# `bipolar` marks a slot that swings both ways (the README's ±); a General slot takes its
# control's.
#
# 127 is not a slot: as a parameter's source it means the parameter's own control slot, which
# holds the value of its CC off the bus (see spms1_main.rb), so no other input or parameter can
# read it. The numbers the parameters' control slots had on the bus before they moved off it --
# 19-47, 61-64, 69-85, 87, 89-98, 102-105, 107-115 -- are free, as are 21, 26, 67,
# 65, 68, 71, 72, 99-101, 125 and 126, unused already.
signals:
  - { key: NONE,            id: 0, value: 0.0,  short: "0.0",  label: None (constant 0.0), label_ja: なし（定数 0.0） }
  - { key: ONE,             id: 1, value: 1.0,  short: "+1.0", label: Constant 1.0,  label_ja: 定数 1.0 }
  - { key: HALF,            id: 2, value: 0.5,  short: "+0.5", label: Constant 0.5,  label_ja: 定数 0.5 }
  - { key: POINT_TWO,       id: 3, value: 0.2,  short: "+0.2", label: Constant 0.2,  label_ja: 定数 0.2 }
  - { key: POINT_ONE,       id: 4, value: 0.1,  short: "+0.1", label: Constant 0.1,  label_ja: 定数 0.1 }
  - { key: MINUS_POINT_ONE, id: 5, value: -0.1, short: "-0.1", label: Constant -0.1, label_ja: 定数 -0.1 }
  - { key: MINUS_POINT_TWO, id: 6, value: -0.2, short: "-0.2", label: Constant -0.2, label_ja: 定数 -0.2 }
  - { key: MINUS_HALF,      id: 7, value: -0.5, short: "-0.5", label: Constant -0.5, label_ja: 定数 -0.5 }
  - { key: MINUS_ONE,       id: 8, value: -1.0, short: "-1.0", label: Constant -1.0, label_ja: 定数 -1.0 }

  - { key: LFO_1_OUTPUT,       id: 9,  module: LFO_1,    output: Out,    label: LFO 1 Output,       bipolar: true }
  - { key: EG_1_OUTPUT,        id: 10, module: EG_1,     output: Out,    label: EG 1 Output }
  - { key: OSC_1_OUTPUT,       id: 11, module: OSC_1,    output: Out,    label: Osc 1 Output,       bipolar: true }
  - { key: FILTER_1_OUTPUT,    id: 12, module: FILTER_1, output: Out,    label: Filter 1 Output,    bipolar: true }
  - { key: AMP_1_OUTPUT,       id: 13, module: AMP_1,    output: Out,    label: Amp 1 Output,       bipolar: true }
  - { key: MIXER_1_OUTPUT,     id: 14, module: MIXER_1,  output: Out,    label: Mixer 1 Output,     bipolar: true }
  - { key: CHORUS_1_OUTPUT_L,  id: 15, module: CHORUS_1, output: Out L,  label: Chorus 1 Output L,  bipolar: true }
  - { key: CHORUS_1_OUTPUT_R,  id: 16, module: CHORUS_1, output: Out R,  label: Chorus 1 Output R,  bipolar: true }
  - { key: DELAY_1_OUTPUT_L,   id: 17, module: DELAY_1,  output: Out L,  label: Delay 1 Output L,   bipolar: true }
  - { key: DELAY_1_OUTPUT_R,   id: 18, module: DELAY_1,  output: Out R,  label: Delay 1 Output R,   bipolar: true }

  - { key: NOTE_PITCH, id: 48, label: Note Pitch, bipolar: true }
  - { key: NOTE_GATE,  id: 49, label: Note Gate }
  - { key: PITCH_BEND, id: 50, label: Pitch Bend, bipolar: true }

  # Control slots no parameter owns: each is a CC put on the bus for any input or parameter to read.
  # The mod wheel first, unipolar and on CC 1, then four of each kind. The two kinds share General
  # CCs 1-4, one CC filling a slot of each, so a knob can be taken either way without a mixer to
  # shift it.
  - { key: GENERAL_MOD_WHEEL,  id: 51, control: GENERAL_MOD_WHEEL }
  - { key: GENERAL_UNIPOLAR_1, id: 52, control: GENERAL_1, label: General Unipolar 1 }
  - { key: GENERAL_UNIPOLAR_2, id: 53, control: GENERAL_2, label: General Unipolar 2 }
  - { key: GENERAL_UNIPOLAR_3, id: 54, control: GENERAL_3, label: General Unipolar 3 }
  - { key: GENERAL_UNIPOLAR_4, id: 55, control: GENERAL_4, label: General Unipolar 4 }
  - { key: GENERAL_BIPOLAR_1,  id: 56, control: GENERAL_1, label: General Bipolar 1, bipolar: true }
  - { key: GENERAL_BIPOLAR_2,  id: 57, control: GENERAL_2, label: General Bipolar 2, bipolar: true }
  - { key: GENERAL_BIPOLAR_3,  id: 58, control: GENERAL_3, label: General Bipolar 3, bipolar: true }
  - { key: GENERAL_BIPOLAR_4,  id: 59, control: GENERAL_4, label: General Bipolar 4, bipolar: true }

  - { key: PITCH_1_OUTPUT, id: 60, module: PITCH_1, output: Out, label: Pitch 1 Output, bipolar: true }

  # The filter's high pass came after its low pass, and its Out, the two crossfaded by Mode, after
  # Stretch: Out took slot 12, the low pass's until then, as with Mode at its power-up value it is
  # the low pass, and the low pass moved to 117.
  - { key: FILTER_1_OUTPUT_LP, id: 117, module: FILTER_1, output: Out LP, label: Filter 1 Output LP, bipolar: true }
  - { key: FILTER_1_OUTPUT_HP, id: 66,  module: FILTER_1, output: Out HP, label: Filter 1 Output HP, bipolar: true }

  - { key: NOISE_1_OUTPUT,       id: 86, module: NOISE_1, output: Out,       label: Noise 1 Output,       bipolar: true }
  - { key: OSC_2_OUTPUT,         id: 88, module: OSC_2,   output: Out,       label: Osc 2 Output,         bipolar: true }
  - { key: MIXER_2_OUTPUT,       id: 106, module: MIXER_2, output: Out,      label: Mixer 2 Output,       bipolar: true }

  # The noise's red output came after Mixer 2, and its Out, the white and the red crossfaded by
  # Color, after the oscillators' saw and pulse outputs: Out took slot 86, the white's until then,
  # as with Color at its power-up value it is the white, and the white moved to 122.
  - { key: NOISE_1_OUTPUT_WHITE, id: 122, module: NOISE_1, output: Out White, label: Noise 1 Output White, bipolar: true }
  - { key: NOISE_1_OUTPUT_RED,   id: 116, module: NOISE_1, output: Out Red,   label: Noise 1 Output Red,   bipolar: true }

  # The oscillators' saw and pulse outputs came after the filter's Out; each Out keeps its slot and
  # the morph between the two.
  - { key: OSC_1_OUTPUT_SAW,   id: 118, module: OSC_1, output: Out Saw,   label: Osc 1 Output Saw,   bipolar: true }
  - { key: OSC_1_OUTPUT_PULSE, id: 119, module: OSC_1, output: Out Pulse, label: Osc 1 Output Pulse, bipolar: true }
  - { key: OSC_2_OUTPUT_SAW,   id: 120, module: OSC_2, output: Out Saw,   label: Osc 2 Output Saw,   bipolar: true }
  - { key: OSC_2_OUTPUT_PULSE, id: 121, module: OSC_2, output: Out Pulse, label: Osc 2 Output Pulse, bipolar: true }

  # The LFO's triangle and square outputs came after the noise's Out; Out keeps slot 9 and crossfades
  # the two by Wave.
  - { key: LFO_1_OUTPUT_TRIANGLE, id: 123, module: LFO_1, output: Out Triangle, label: LFO 1 Output Triangle, bipolar: true }
  - { key: LFO_1_OUTPUT_SQUARE,   id: 124, module: LFO_1, output: Out Square,   label: LFO 1 Output Square,   bipolar: true }

# Module inputs, NRPN category 1, listed in the editor's order, each by its entry: what feeds each
# one in the default patch (`source`, a signal key). `label` is the editor's, on the module; `name`
# the README's, after the module's label. An input with no module is a side of the final output.
inputs:
  - { entry: 0,  module: EG_1,        key: GATE,        label: Gate In,        name: Gate In,        source: NOTE_GATE }
  - { entry: 1,  module: OSC_1,       key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 21, module: OSC_1,       key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 2,  module: OSC_1,       key: MOD_2,       label: Mod 2 In,   name: Mod 2 In,   source: LFO_1_OUTPUT }
  - { entry: 24, module: OSC_2,       key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 25, module: OSC_2,       key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 26, module: OSC_2,       key: MOD_2,       label: Mod 2 In,       name: Mod 2 In,       source: LFO_1_OUTPUT }
  - { entry: 35, module: OSC_2,       key: PW_MOD_1,    label: PW Mod 1 In,    name: PW Mod 1 In,    source: EG_1_OUTPUT }
  - { entry: 27, module: OSC_2,       key: PW_MOD_2,    label: PW Mod 2 In,    name: PW Mod 2 In,    source: LFO_1_OUTPUT }
  # 22 and 23, Filter 1's Audio 2 In and Audio 3 In for a while, are unused.
  - { entry: 3,  module: FILTER_1,    key: AUDIO,       label: Audio In,       name: Audio In,       source: MIXER_2_OUTPUT }
  - { entry: 4,  module: FILTER_1,    key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 5,  module: AMP_1,       key: AUDIO,       label: Audio In,       name: Audio In,       source: FILTER_1_OUTPUT }
  - { entry: 6,  module: AMP_1,       key: MOD,         label: Mod In,         name: Mod In,         source: EG_1_OUTPUT }
  - { entry: 7,  module: MIXER_1,     key: IN_1,        label: In 1,           name: In 1,           source: NONE }
  - { entry: 8,  module: MIXER_1,     key: IN_2,        label: In 2,           name: In 2,           source: NONE }
  - { entry: 28, module: MIXER_1,     key: IN_3,        label: In 3,           name: In 3,           source: NONE }
  - { entry: 29, module: MIXER_1,     key: IN_4,        label: In 4,           name: In 4,           source: NONE }
  - { entry: 30, module: MIXER_2,     key: IN_1,        label: In 1,           name: In 1,           source: OSC_1_OUTPUT }
  - { entry: 31, module: MIXER_2,     key: IN_2,        label: In 2,           name: In 2,           source: OSC_2_OUTPUT }
  - { entry: 32, module: MIXER_2,     key: IN_3,        label: In 3,           name: In 3,           source: NOISE_1_OUTPUT }
  - { entry: 33, module: MIXER_2,     key: IN_4,        label: In 4,           name: In 4,           source: NONE }
  - { entry: 9,  module: CHORUS_1,    key: AUDIO,       label: Audio In,       name: Audio In,       source: AMP_1_OUTPUT }
  - { entry: 10, module: DELAY_1,     key: AUDIO_L,     label: Audio In L,     name: Audio In L,     source: CHORUS_1_OUTPUT_L }
  - { entry: 11, module: DELAY_1,     key: AUDIO_R,     label: Audio In R,     name: Audio In R,     source: CHORUS_1_OUTPUT_R }
  - { entry: 12,                      key: OUTPUT_L,    label: L,              name: Final Output L, name_ja: 最終出力 L, source: DELAY_1_OUTPUT_L }
  - { entry: 13,                      key: OUTPUT_R,    label: R,              name: Final Output R, name_ja: 最終出力 R, source: DELAY_1_OUTPUT_R }
  - { entry: 14, module: PITCH_1,      key: PITCH,       label: Pitch In,       name: Pitch In,       source: NOTE_PITCH }
  # Each oscillator's PW Mod 1 In came after Mixer 2 In 4, and its PW Mod In became PW Mod 2 In: the
  # envelope and the LFO wired to the pulse width as Mod 1 In and Mod 2 In are to the pitch.
  - { entry: 34, module: OSC_1,       key: PW_MOD_1,    label: PW Mod 1 In,    name: PW Mod 1 In,    source: EG_1_OUTPUT }
  - { entry: 15, module: OSC_1,       key: PW_MOD_2,    label: PW Mod 2 In,    name: PW Mod 2 In,    source: LFO_1_OUTPUT }
  - { entry: 16, module: LFO_1,       key: RATE_MOD,    label: Rate Mod In,    name: Rate Mod In,    source: NONE }
  - { entry: 17, module: FILTER_1,    key: MOD_2,       label: Mod 2 In,       name: Mod 2 In,       source: LFO_1_OUTPUT }
  - { entry: 18, module: FILTER_1,    key: MOD_3,       label: Mod 3 In,       name: Mod 3 In,       source: PITCH_1_OUTPUT }
  - { entry: 19, module: PITCH_1,      key: BEND,        label: Bend In,      name: Bend In,      source: PITCH_BEND }
  - { entry: 20, module: LFO_1,       key: LEVEL_MOD,   label: Level Mod In,   name: Level Mod In,   source: GENERAL_MOD_WHEEL }

# Controls, listed in the editor's order, each by its entry: a parameter is one entry of NRPN category 2 (where it takes its value) and
# the same entry of category 3 (which CC fills its control slot); a General control is in
# category 3 only. `cc` is the CC of the default patch, 0 for none, and `value` what that CC
# powers up at; for a control with no CC, what the editor's Init Values sets the CC given to it
# to. A parameter takes its own control slot, off the bus, unless `source` (a signal key) says
# otherwise. Why the defaults are what they are is in spms1_main.rb, above the default patch.
controls:
  - { entry: 0,  module: LFO_1,     key: RATE,         label: Rate,         cc: 3,   value: 64 }
  # LFO 1 Rate Mod Amt and Pol came after Amp 1's old modulation controls, and Level Mod Amt and
  # Pol last of all, but each pair is listed after what it moves. None has a CC: the default patch
  # points each at 1.0 and +0.5, a depth of 1.0. Rate Mod In is left unrouted, so routing a source
  # to it is enough; Level Mod In takes the mod wheel, which adds to Level (CC 113) up to its top.
  - { entry: 40, module: LFO_1,     key: RATE_MOD_AMT, label: Rate Mod Amt, cc: 0,   value: 124, source: ONE }
  - { entry: 41, module: LFO_1,     key: RATE_MOD_POL, label: Rate Mod Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
  - { entry: 1,  module: LFO_1,     key: LEVEL,        label: Level,        cc: 113, value: 124 }
  # Wave came after Noise 1 Color. It crossfades Out from the triangle (0.0) to the square (1.0), on
  # CC 33, LFO Wave's in PRA32-U2, and powers up at CC 4, 0.0, the triangle.
  - { entry: 96, module: LFO_1,     key: WAVE,         label: Wave,         cc: 33,  value: 4 }
  - { entry: 50, module: LFO_1,     key: LEVEL_MOD_AMT, label: Level Mod Amt, cc: 0,  value: 124, source: ONE }
  - { entry: 51, module: LFO_1,     key: LEVEL_MOD_POL, label: Level Mod Pol, cc: 0,  value: 124, source: HALF, bipolar: true }
  - { entry: 3,  module: EG_1,      key: ATTACK,       label: Attack,       cc: 73,  value: 4 }
  - { entry: 4,  module: EG_1,      key: DECAY,        label: Decay,        cc: 75,  value: 94 }
  - { entry: 5,  module: EG_1,      key: SUSTAIN,      label: Sustain,      cc: 30,  value: 124 }
  - { entry: 6,  module: EG_1,      key: LEVEL,        label: Level,        cc: 0,   source: ONE }
  # Osc 1 in the editor: the pitch and its two modulations, then the waveform and the pulse
  # width's two modulations, each target next to what moves it. Pulse Width, PW Mod 2 Amt and Pol
  # came after Pitch 1, so their entries follow its, but they are listed here. Pitch Coarse and Fine
  # have no CC and stay at 0.0 by default: the transposition is Pitch 1's Coarse and Fine,
  # on CC 86 and 70. Pulse Width and the PW Mod
  # Amts power up at CC 4, 0.0: a pulse of 50% and no modulation of it, so the default patch renders
  # as before. The PW Mod Pols have no CC and read +0.5, as each modulation polarity does.
  - { entry: 9,  module: OSC_1,     key: PITCH_COARSE,  label: Pitch Coarse,  cc: 0,   value: 64, bipolar: true }
  - { entry: 10, module: OSC_1,     key: PITCH_FINE,    label: Pitch Fine,    cc: 0,   value: 64, bipolar: true }
  # Entries 42 and 43, Osc 1's old Mod 1 Amt and Pol, are unused: Pitch In takes the note whole.
  # Mod 1 Amt and Pol came after Mixer 1 Out Level, so their entries follow its. Mod 1 In takes
  # the envelope, for a pitch envelope; Mod 1 Amt is on CC 89 and powers up at CC 4, 0.0, leaving
  # it off, and Mod 1 Pol reads +0.5, as Filter 1 Mod 1 Pol does.
  - { entry: 55, module: OSC_1,     key: MOD_1_AMT, label: Mod 1 Amt, cc: 89,  value: 4 }
  - { entry: 56, module: OSC_1,     key: MOD_1_POL, label: Mod 1 Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
  - { entry: 11, module: OSC_1,     key: MOD_2_AMT, label: Mod 2 Amt, cc: 13,  value: 4 }
  - { entry: 12, module: OSC_1,     key: MOD_2_POL, label: Mod 2 Pol, cc: 0,   value: 124, source: POINT_ONE, bipolar: true }
  - { entry: 8,  module: OSC_1,     key: WAVE,     label: Wave,         cc: 102, value: 4 }
  - { entry: 35, module: OSC_1,     key: PULSE_WIDTH,  label: Pulse Width,  cc: 114, value: 4 }
  # PW Mod 1 Amt and Pol came after Filter 1 Mode, and PW Mod Amt and Pol became PW Mod 2 Amt and
  # Pol. The two Amts are on CC 8 and 103, EG Mod Dst's and LFO Mod Dst's in PRA32-U2, whose
  # Mod Amts are on 89 and 13 as Mod 1 Amt and Mod 2 Amt are here: in place of a destination
  # switch, each destination has an Amt of its own. Both power up at CC 4, 0.0.
  - { entry: 91, module: OSC_1,     key: PW_MOD_1_AMT, label: PW Mod 1 Amt,    cc: 8,   value: 4 }
  - { entry: 92, module: OSC_1,     key: PW_MOD_1_POL, label: PW Mod 1 Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
  - { entry: 36, module: OSC_1,     key: PW_MOD_2_AMT, label: PW Mod 2 Amt,    cc: 103, value: 4 }
  - { entry: 37, module: OSC_1,     key: PW_MOD_2_POL, label: PW Mod 2 Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
  # Osc 2 came after Noise 1, so its entries follow. Pitch Coarse and Fine are its own, on CC 85 and
  # 76, to tune it against Osc 1: Coarse powers up at CC 64, in unison, and Fine at CC 76, 12 cents
  # sharp, for a slow beat once Osc 2 is turned up. Wave is its own too, on CC 104 next to Osc 1's on
  # CC 102, sawtooth at power-up as Osc 1's is. Everything else follows Osc 1 by default: each
  # amount and the pulse width is on Osc 1's CC, so one CC moves both oscillators, and each polarity
  # reads the constant Osc 1's does. Osc 2 is heard through Mixer 2 Level 2 (CC 21), which powers
  # up at 0.0.
  - { entry: 59, module: OSC_2,     key: PITCH_COARSE,  label: Pitch Coarse,  cc: 85,  value: 64, bipolar: true }
  - { entry: 60, module: OSC_2,     key: PITCH_FINE,    label: Pitch Fine,    cc: 76,  value: 76, bipolar: true }
  - { entry: 61, module: OSC_2,     key: MOD_1_AMT, label: Mod 1 Amt, cc: 89,  value: 4 }
  - { entry: 62, module: OSC_2,     key: MOD_1_POL, label: Mod 1 Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
  - { entry: 63, module: OSC_2,     key: MOD_2_AMT, label: Mod 2 Amt, cc: 13,  value: 4 }
  - { entry: 64, module: OSC_2,     key: MOD_2_POL, label: Mod 2 Pol, cc: 0,   value: 124, source: POINT_ONE, bipolar: true }
  - { entry: 58, module: OSC_2,     key: WAVE,     label: Wave,         cc: 104, value: 4 }
  - { entry: 65, module: OSC_2,     key: PULSE_WIDTH,  label: Pulse Width,  cc: 114, value: 4 }
  - { entry: 93, module: OSC_2,     key: PW_MOD_1_AMT, label: PW Mod 1 Amt,    cc: 8,   value: 4 }
  - { entry: 94, module: OSC_2,     key: PW_MOD_1_POL, label: PW Mod 1 Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
  - { entry: 66, module: OSC_2,     key: PW_MOD_2_AMT, label: PW Mod 2 Amt,    cc: 103, value: 4 }
  - { entry: 67, module: OSC_2,     key: PW_MOD_2_POL, label: PW Mod 2 Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
  # Filter 1 in the editor: Gain, the cutoff and its three modulations, then the resonance. Entries
  # 68-70, its audio gains for a while, are unused: Mixer 2 levels the audio now. Mod 2
  # Amt and Pol came last of all, so their entries follow every other. Mod 2 Amt powers up at
  # CC 4, 0.0, so the LFO on Mod 2 In leaves the cutoff alone until it is turned up. Mod 2 Pol reads 0.1, as
  # Osc 1 Mod 2 Pol does, which brings the LFO down to a musical depth on the cutoff. Mod 3 is the keyboard
  # tracking: Mod 3 In takes the pitch from Pitch 1, as Osc 1 Pitch In does, and Mod 3 Pol reads
  # +0.5, so that Mod 3 Amt (CC 9) at its top makes the cutoff follow the note a semitone for a
  # semitone, unmoved at note 60. Mod 3 Amt powers up at CC 4, 0.0, with the tracking off.
  - { entry: 15, module: FILTER_1,  key: GAIN,         label: Gain,         cc: 112, value: 64 }
  - { entry: 13, module: FILTER_1,  key: CUTOFF,       label: Cutoff,       cc: 74,  value: 100 }
  - { entry: 16, module: FILTER_1,  key: MOD_1_AMT, label: Mod 1 Amt,     cc: 24,  value: 28 }
  - { entry: 17, module: FILTER_1,  key: MOD_1_POL, label: Mod 1 Pol, cc: 0,   value: 124, source: HALF, bipolar: true }
