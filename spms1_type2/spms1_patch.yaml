  - { entry: 60, module: NOISE_1,   key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  # Mixer 2, the audio ahead of the filter: Osc 1 on In 1, Osc 2 on In 2, Osc 1's sub on In 3 and
  # the noise on In 4.
  # Level 1 and 2 (CC 19 and 20) power up at CC 88, 0.7: two saws 11 cents apart come out about
  # as loud as one at 1.0, as 0.7 is about one over the square root of 2. Level 3, on CC 21,
  # powers up at 0.0, leaving Osc 1's sub on In 3 silent. Level 4 (CC 23) powers up at 0.0, leaving the noise, at
  # full level from Noise 1, silent. Out Level has no CC and holds 0.5: how
  # hard the sum drives the filter, the one Mixer 2 feeds, and what keeps two oscillators and the
  # noise all at full level, a sum of 1.5 at most, inside the mixer's range.
  - { entry: 61, module: MIXER_2,   key: LEVEL_1,      label: Level 1,      cc: 19,  value: 88,  hint_inputs: [IN_1], favorite: true, set: set_level_1 }
  - { entry: 62, module: MIXER_2,   key: LEVEL_2,      label: Level 2,      cc: 20,  value: 88,  hint_inputs: [IN_2], favorite: true, set: set_level_2 }
  - { entry: 63, module: MIXER_2,   key: LEVEL_3,      label: Level 3,      cc: 21,  value: 4, hint_inputs: [IN_3], set: set_level_3 }
