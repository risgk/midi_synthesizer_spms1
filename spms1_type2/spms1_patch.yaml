  - { entry: 38, module: MIXER_2,   key: LEVEL_3,      label: Level 3,      cc: 23,  value: 4, set: set_level_3 }
  - { entry: 39, module: MIXER_2,   key: OUT_POL,    label: Out Pol,    cc: 0,   value: 124, bipolar: true, set: set_out_polarity }
  # Filter 1 in the editor: Gain, the cutoff, its keyboard tracking and its two modulations, then
  # the resonance and Mode. Pitch In takes the pitch from Pitch 1, as Osc 1 Pitch In does, and
  # Pitch Amt (CC 9) at its top makes the cutoff follow the note a semitone for a
  # semitone, unmoved at note 60; it powers up at CC 4, 0.0, with the tracking off. Mod 1/2 Mix,
  # on CC 25, crossfades the envelope on Mod 1 In and the LFO on Mod 2 In linearly, as Osc 1's
  # does, and powers up at CC 4, -0.5, the envelope alone, so the LFO leaves the cutoff alone until
  # it is turned up. Mod Amt, on CC 117, is how far the mix moves the cutoff, as Osc 1 PW Mod Amt
  # is for the pulse width. It powers up at CC 28, 0.2 of the mix; CC 124 adds the mix as it is,
  # and CC 4 leaves the cutoff alone. A modulation that closes the filter takes an inverted source,
  # such as EG 1 Out Inv. Mode crossfades Out from the low pass (0.0) through a
  # notch (0.5) to the high pass (1.0), on CC 39, Filter Mode's in PRA32-U2, and powers up at CC 4,
  # 0.0, the low pass.
  - { entry: 40, module: FILTER_1,  key: GAIN,         label: Gain,         cc: 112, value: 64, set: set_gain }
