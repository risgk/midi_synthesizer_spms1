# MIDI Synthesizer SPMS-1 (type-2): the patch, as data
#
# Every number a patch is made of -- module ids, bus slots, NRPN entries -- and the default patch,
# in one place. patch_gen/spms1_patch_gen.rb writes what the rest of the sketch reads from here:
#
#   spms1/spms1_patch.rb  the constants and the default patch, for spms1_main.rb
#   spms1_editor.html     the tables of the editor, between its "patch_gen" markers
#   README.md             the NRPN tables, between the "patch_gen" markers, and README.ja.md likewise
#   spms1/spms1_main.rb   the wiring of the loop, between its "patch_gen" markers: the module
#                         instances, the routing and CC reads, the setters and the dispatch
#
# Run `ruby patch_gen/spms1_patch_gen.rb` after a change here, and commit what it writes;
# `--check` says whether that is needed, as the GitHub Actions workflow does.
#
# Every list is numbered in its order, from 0 (from 1 for the modules), with no gaps, which
# patch_gen checks: the modules in the default run order; on the bus the constants, then what
# comes from MIDI, then each module's outputs, module by module in that order, its main output
# first; the inputs and the controls module by module in the same order, the final output's sides
# last among the inputs and the General controls last among the controls. Something added goes
# where it belongs and the numbers after it move up, so a patch sent as NRPN bytes, which names
# everything by number, is for the version it was made for; the editor saves a patch by name and
# reads it into any version. Each number is still written out, so that a renumbering shows;
# `ruby patch_gen/spms1_patch_gen.rb --renumber` writes them again from the order of the lists.
#
# Labels: `label` is what the README and the editor call a thing. Where the Japanese README calls
# it otherwise, `label_ja` says so.

# Module ids (NRPN category 0 values). 0 is MODULE_NONE, which ends the run order. A module with
# `stereo` writes a left and a right output. `class` is the Ruby class of the module, and `process`
# the inputs its process method takes after the control tick, in order, by their keys below; the
# loop is written from these (see patch_gen/spms1_patch_gen.rb).
modules:
  - { key: EG_1, id: 1, label: EG 1, class: EnvGen, process: [GATE] }
  - { key: LFO_1,     id: 2, label: LFO 1, class: LFO, process: [RATE_MOD, LEVEL_MOD] }
  - { key: MIXER_1,   id: 3, label: Mixer 1, class: Mixer, process: [IN_1, IN_2, IN_3, IN_4] }
  - { key: PITCH_1,    id: 4, label: Pitch 1, class: Pitch, process: [PITCH, BEND] }
  - { key: OSC_1,     id: 5, label: Osc 1, class: Osc, process: [PITCH, MOD_1, MOD_2] }
  - { key: OSC_2,      id: 6, label: Osc 2, class: Osc, process: [PITCH, MOD_1, MOD_2] }
  - { key: NOISE_1,    id: 7, label: Noise 1, class: Noise, process: [] }
  - { key: MIXER_2,    id: 8, label: Mixer 2, class: Mixer, process: [IN_1, IN_2, IN_3, IN_4] }
  - { key: FILTER_1,  id: 9, label: Filter 1, class: Filter, process: [AUDIO, PITCH, MOD_1, MOD_2] }
  - { key: AMP_1,     id: 10, label: Amp 1, class: Amp, process: [AUDIO, MOD] }
  - { key: CHORUS_1,  id: 11, label: Chorus 1, stereo: true, class: Chorus, process: [AUDIO] }
  - { key: DELAY_1,   id: 12, label: Delay 1,  stereo: true, class: Delay, process: [AUDIO_L, AUDIO_R] }

# The default patch. Every module is in the run order, so a patch only ever has to route, never to
# switch something on first. Pitch 1 runs just ahead of the oscillator, taking Note Pitch and
# handing it to the oscillator: its Glide powers up at 0.0, where it passes its input through as it
# is, so the patch plays as one without it until CC 5 turns the portamento up. Pitch Bend goes to
# its Bend In, added past the glide, 2 semitones either way at Bend Amt's power-up value of CC 8, so
# the bend reaches the oscillator and the filter's keyboard tracking at once. Running after the LFO,
# the envelope and Mixer 1 lets it take any of them in the same sample, and the oscillators and the
# filter read it so too. Mixer 1 runs after the modulation sources and ahead of the oscillators, so
# it sees this sample's LFO and envelope and can feed the oscillators, the filter and the amp
# without a sample's delay. The default patch leaves it unused: the LFO goes straight to the
# oscillator, on Mod 2 In, at a vibrato depth: Pitch Mod 2 Amt (CC 13) powers up at CC 9, which
# with Osc 1 Pitch Mod Range at 0.2 makes the LFO at full level swing the pitch 50 cents either
# way, the Modulation Depth Range a GM2 sound module powers up at. The LFO itself powers up at
# Level 0.0, so the vibrato is the mod wheel's, from none to 50 cents. PW Mod 2 Amt, on CC 103,
# takes the LFO to the pulse width and powers up at 0.0. Osc 1 Pitch In takes the note from
# Pitch 1 whole, in tune. Osc 1 Mod 1 In takes the envelope, for a pitch envelope, but Pitch Mod 1
# Amt (CC 89) and PW Mod 1 Amt (CC 8) power up at 0.0 too. The LFO also reaches Filter 1 Mod 2 In,
# but Filter 1 Mod 2 Amt powers up at 0.0, so the cutoff follows the envelope alone until CC 25
# turns it up.
# Filter 1 Pitch In takes Pitch 1's pitch too, for keyboard tracking, but Filter 1 Pitch Amt
# powers up at 0.0 and leaves it off until CC 9. Noise 1 runs after the oscillators, as it is mostly a sound of its own (a modulation taking
# it is a sample late, which it does not hear), at full level: its Level has no CC and holds 1.0.
# Mixer 2 runs after it, just ahead of the filter, which it feeds: Osc 1 on its In 1, Osc 2 on In 2
# and the noise on In 3. Its Level 1 and 2, on CC 20 and 21, power up at 0.7, so the two
# oscillators sound together about as loud as one at full level, and Level 3, on CC 23, at 0.0,
# so the noise is silent until CC 23. Osc 2 plays the note from Pitch 1, as Osc 1 does, tuned by its own
# Pitch Coarse and Fine (CC 85 and 76), 12 cents sharp at power-up, and has a Wave of its own on CC
# 104 (Osc 1's on CC 102); it follows Osc 1 in everything else: each of its Mod Amts and its PW
# are on Osc 1's CCs, so one CC moves both. Mixer 1 has no CC, its levels holding 0.0, so its
# inputs start closed, and Mixer 2 Level 4 has none either and holds 0.0. Each mixer's Out Level has no
# CC and holds 0.5, which keeps two full-scale signals and a third at half inside its range;
# Mixer 2's also sets how hard the audio drives the filter. EG 1, LFO 1 and
# the mixers each put out an inverted output as well, Out Inv, which the default patch leaves
# unrouted. LFO 1 Level is on
# CC 113 and powers up at 0.0, and the mod wheel on its Level Mod In adds to it up to 1.0; EG 1
# Level has no CC and holds 1.0, passing the envelope as it is. The chorus and the delay run last,
# after the amp: the chorus takes the mono amp and spreads it into a left and a right, the delay
# takes the two sides, and its two outputs are what the final output's left and right read.
#
# The run order of the default patch, the order of the module ids too. The envelope runs ahead of
# the LFO, so that the LFO's Mod Ins can read it in the same sample, as for a vibrato that fades in.
default_order: [EG_1, LFO_1, MIXER_1, PITCH_1, OSC_1, OSC_2, NOISE_1, MIXER_2, FILTER_1, AMP_1, CHORUS_1, DELAY_1]

# Slots of the signal bus (the values of NRPN categories 1 and 2), each one of:
#   value:    a constant, which the bus holds from startup; `short` is the editor's label for it
#   output:   a module output, `module` writing it, `output` its label on the module in the editor;
#             `get` the method that reads it after process, or none for the one process returns
#   control:  a General slot, which the CC of that General control (below) fills
#   (none):   a note input, written by the synth from MIDI
# `bipolar` marks a slot that swings both ways (the README's ±); a General slot takes its
# control's.
#
# 127 is not a slot: as a parameter's source it means the parameter's own control slot, which
# holds the value of its CC off the bus (see spms1_main.rb), so no other input or parameter can
# read it.
signals:
  # The constants, from the top down. NONE is 0, what an NRPN entry nobody has set reads, so that
  # an unrouted input is silent.
  - { key: NONE,            id: 0, value: 0.0,  short: "0.0",  label: None (constant 0.0), label_ja: なし（定数 0.0） }
  - { key: ONE,             id: 1, value: 1.0,  short: "+1.0", label: Constant 1.0,  label_ja: 定数 1.0 }
  - { key: HALF,            id: 2, value: 0.5,  short: "+0.5", label: Constant 0.5,  label_ja: 定数 0.5 }
  - { key: MINUS_HALF,      id: 3, value: -0.5, short: "-0.5", label: Constant -0.5, label_ja: 定数 -0.5 }
  - { key: MINUS_ONE,       id: 4, value: -1.0, short: "-1.0", label: Constant -1.0, label_ja: 定数 -1.0 }

  # From MIDI: the note, the bend and the General slots.
  - { key: NOTE_PITCH, id: 5, label: Note Pitch, bipolar: true }
  - { key: NOTE_GATE,  id: 6, label: Note Gate }
  - { key: PITCH_BEND, id: 7, label: Pitch Bend, bipolar: true }
  # Control slots no parameter owns: each is a CC put on the bus for any input or parameter to read.
  # The mod wheel first, unipolar and on CC 1, then four of each kind. The two kinds share General
  # CCs 1-4, one CC filling a slot of each, so a knob can be taken either way without a mixer to
  # shift it.
  - { key: GENERAL_MOD_WHEEL,  id: 8, control: GENERAL_MOD_WHEEL }
  - { key: GENERAL_UNIPOLAR_1, id: 9, control: GENERAL_1, label: General Unipolar 1 }
  - { key: GENERAL_UNIPOLAR_2, id: 10, control: GENERAL_2, label: General Unipolar 2 }
  - { key: GENERAL_UNIPOLAR_3, id: 11, control: GENERAL_3, label: General Unipolar 3 }
  - { key: GENERAL_UNIPOLAR_4, id: 12, control: GENERAL_4, label: General Unipolar 4 }
  - { key: GENERAL_BIPOLAR_1,  id: 13, control: GENERAL_1, label: General Bipolar 1, bipolar: true }
  - { key: GENERAL_BIPOLAR_2,  id: 14, control: GENERAL_2, label: General Bipolar 2, bipolar: true }
  - { key: GENERAL_BIPOLAR_3,  id: 15, control: GENERAL_3, label: General Bipolar 3, bipolar: true }
  - { key: GENERAL_BIPOLAR_4,  id: 16, control: GENERAL_4, label: General Bipolar 4, bipolar: true }

  # The module outputs, module by module, each module's main output first.
  - { key: EG_1_OUTPUT,        id: 17, module: EG_1,     output: Out,    label: EG 1 Output }
  # Out Inv, of the envelope, the LFO and the mixers, is Out negated.
  - { key: EG_1_OUTPUT_INV,    id: 18, module: EG_1,     output: Out Inv, label: EG 1 Output Inv, get: output_inverted }
  # Out is the triangle and the square crossfaded by Wave; each of the three has its inverted output
  # beside it. The square is unipolar, 0.0 and 1.0, and its inverted output 0.0 and -1.0.
  - { key: LFO_1_OUTPUT,       id: 19, module: LFO_1,    output: Out,    label: LFO 1 Output,       bipolar: true }
  - { key: LFO_1_OUTPUT_INV,   id: 20, module: LFO_1,    output: Out Inv, label: LFO 1 Output Inv,  bipolar: true, get: output_inverted }
  - { key: LFO_1_OUTPUT_TRIANGLE, id: 21, module: LFO_1, output: Out Triangle, label: LFO 1 Output Triangle, bipolar: true, get: output_triangle }
  - { key: LFO_1_OUTPUT_TRIANGLE_INV, id: 22, module: LFO_1, output: Out Triangle Inv, label: LFO 1 Output Triangle Inv, bipolar: true, get: output_triangle_inverted }
  - { key: LFO_1_OUTPUT_SQUARE,   id: 23, module: LFO_1, output: Out Square,   label: LFO 1 Output Square,   get: output_square }
  - { key: LFO_1_OUTPUT_SQUARE_INV, id: 24, module: LFO_1, output: Out Square Inv, label: LFO 1 Output Square Inv, get: output_square_inverted }
  - { key: MIXER_1_OUTPUT,     id: 25, module: MIXER_1,  output: Out,    label: Mixer 1 Output,     bipolar: true }
  - { key: MIXER_1_OUTPUT_INV,   id: 26, module: MIXER_1,  output: Out Inv, label: Mixer 1 Output Inv, bipolar: true, get: output_inverted }
  - { key: PITCH_1_OUTPUT, id: 27, module: PITCH_1, output: Out, label: Pitch 1 Output, bipolar: true }
  # Each oscillator's Out is the morph from the saw to the pulse, by Wave.
  - { key: OSC_1_OUTPUT,       id: 28, module: OSC_1,    output: Out,    label: Osc 1 Output,       bipolar: true }
  - { key: OSC_1_OUTPUT_SAW,   id: 29, module: OSC_1, output: Out Saw,   label: Osc 1 Output Saw,   bipolar: true, get: output_saw }
  - { key: OSC_1_OUTPUT_PULSE, id: 30, module: OSC_1, output: Out Pulse, label: Osc 1 Output Pulse, bipolar: true, get: output_pulse }
  - { key: OSC_2_OUTPUT,         id: 31, module: OSC_2,   output: Out,       label: Osc 2 Output,         bipolar: true }
  - { key: OSC_2_OUTPUT_SAW,   id: 32, module: OSC_2, output: Out Saw,   label: Osc 2 Output Saw,   bipolar: true, get: output_saw }
  - { key: OSC_2_OUTPUT_PULSE, id: 33, module: OSC_2, output: Out Pulse, label: Osc 2 Output Pulse, bipolar: true, get: output_pulse }
  # Out is the white and the red crossfaded by Color.
  - { key: NOISE_1_OUTPUT,       id: 34, module: NOISE_1, output: Out,       label: Noise 1 Output,       bipolar: true }
  - { key: NOISE_1_OUTPUT_WHITE, id: 35, module: NOISE_1, output: Out White, label: Noise 1 Output White, bipolar: true, get: output_white }
  - { key: NOISE_1_OUTPUT_RED,   id: 36, module: NOISE_1, output: Out Red,   label: Noise 1 Output Red,   bipolar: true, get: output_red }
  - { key: MIXER_2_OUTPUT,       id: 37, module: MIXER_2, output: Out,      label: Mixer 2 Output,       bipolar: true }
  - { key: MIXER_2_OUTPUT_INV,   id: 38, module: MIXER_2,  output: Out Inv, label: Mixer 2 Output Inv, bipolar: true, get: output_inverted }
  # Out is the low pass and the high pass crossfaded by Mode, through a notch.
  - { key: FILTER_1_OUTPUT,    id: 39, module: FILTER_1, output: Out,    label: Filter 1 Output,    bipolar: true }
  - { key: FILTER_1_OUTPUT_LP, id: 40, module: FILTER_1, output: Out LP, label: Filter 1 Output LP, bipolar: true, get: output_lp }
  - { key: FILTER_1_OUTPUT_HP, id: 41, module: FILTER_1, output: Out HP, label: Filter 1 Output HP, bipolar: true, get: output_hp }
  - { key: AMP_1_OUTPUT,       id: 42, module: AMP_1,    output: Out,    label: Amp 1 Output,       bipolar: true }
  # Out Mono, of the chorus and of the delay, is the average of the two sides, a sub output.
  - { key: CHORUS_1_OUTPUT_L,  id: 43, module: CHORUS_1, output: Out L,  label: Chorus 1 Output L,  bipolar: true, get: output_l }
  - { key: CHORUS_1_OUTPUT_R,  id: 44, module: CHORUS_1, output: Out R,  label: Chorus 1 Output R,  bipolar: true, get: output_r }
  - { key: CHORUS_1_OUTPUT_MONO, id: 45, module: CHORUS_1, output: Out Mono, label: Chorus 1 Output Mono, bipolar: true, get: output_mono }
  - { key: DELAY_1_OUTPUT_L,   id: 46, module: DELAY_1,  output: Out L,  label: Delay 1 Output L,   bipolar: true, get: output_l }
  - { key: DELAY_1_OUTPUT_R,   id: 47, module: DELAY_1,  output: Out R,  label: Delay 1 Output R,   bipolar: true, get: output_r }
  - { key: DELAY_1_OUTPUT_MONO,  id: 48, module: DELAY_1,  output: Out Mono, label: Delay 1 Output Mono,  bipolar: true, get: output_mono }

# Module inputs, NRPN category 1, listed in the editor's order, each by its entry: what feeds each
# one in the default patch (`source`, a signal key). `label` is the editor's, on the module; `name`
# the README's, after the module's label. An input with no module is a side of the final output.
inputs:
  - { entry: 0, module: EG_1,        key: GATE,        label: Gate In,        name: Gate In,        source: NOTE_GATE }
  - { entry: 1, module: LFO_1,       key: RATE_MOD,    label: Rate Mod In,    name: Rate Mod In,    source: NONE }
  - { entry: 2, module: LFO_1,       key: LEVEL_MOD,   label: Level Mod In,   name: Level Mod In,   source: GENERAL_MOD_WHEEL }
  - { entry: 3, module: MIXER_1,     key: IN_1,        label: In 1,           name: In 1,           source: NONE }
  - { entry: 4, module: MIXER_1,     key: IN_2,        label: In 2,           name: In 2,           source: NONE }
  - { entry: 5, module: MIXER_1,     key: IN_3,        label: In 3,           name: In 3,           source: NONE }
  - { entry: 6, module: MIXER_1,     key: IN_4,        label: In 4,           name: In 4,           source: NONE }
  - { entry: 7, module: PITCH_1,      key: PITCH,       label: Pitch In,       name: Pitch In,       source: NOTE_PITCH }
  - { entry: 8, module: PITCH_1,      key: BEND,        label: Bend In,      name: Bend In,      source: PITCH_BEND }
  - { entry: 9, module: OSC_1,       key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 10, module: OSC_1,       key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 11, module: OSC_1,       key: MOD_2,       label: Mod 2 In,   name: Mod 2 In,   source: LFO_1_OUTPUT }
  - { entry: 12, module: OSC_2,       key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 13, module: OSC_2,       key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 14, module: OSC_2,       key: MOD_2,       label: Mod 2 In,       name: Mod 2 In,       source: LFO_1_OUTPUT }
  - { entry: 15, module: MIXER_2,     key: IN_1,        label: In 1,           name: In 1,           source: OSC_1_OUTPUT }
  - { entry: 16, module: MIXER_2,     key: IN_2,        label: In 2,           name: In 2,           source: OSC_2_OUTPUT }
  - { entry: 17, module: MIXER_2,     key: IN_3,        label: In 3,           name: In 3,           source: NOISE_1_OUTPUT }
  - { entry: 18, module: MIXER_2,     key: IN_4,        label: In 4,           name: In 4,           source: NONE }
  - { entry: 19, module: FILTER_1,    key: AUDIO,       label: Audio In,       name: Audio In,       source: MIXER_2_OUTPUT }
  - { entry: 20, module: FILTER_1,    key: PITCH,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT }
  - { entry: 21, module: FILTER_1,    key: MOD_1,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 22, module: FILTER_1,    key: MOD_2,       label: Mod 2 In,       name: Mod 2 In,       source: LFO_1_OUTPUT }
  - { entry: 23, module: AMP_1,       key: AUDIO,       label: Audio In,       name: Audio In,       source: FILTER_1_OUTPUT }
  - { entry: 24, module: AMP_1,       key: MOD,         label: Mod In,         name: Mod In,         source: EG_1_OUTPUT }
  - { entry: 25, module: CHORUS_1,    key: AUDIO,       label: Audio In,       name: Audio In,       source: AMP_1_OUTPUT }
  - { entry: 26, module: DELAY_1,     key: AUDIO_L,     label: Audio In L,     name: Audio In L,     source: CHORUS_1_OUTPUT_L }
  - { entry: 27, module: DELAY_1,     key: AUDIO_R,     label: Audio In R,     name: Audio In R,     source: CHORUS_1_OUTPUT_R }
  - { entry: 28, key: OUTPUT_L,    label: L,              name: Final Output L, name_ja: 最終出力 L, source: DELAY_1_OUTPUT_L }
  - { entry: 29, key: OUTPUT_R,    label: R,              name: Final Output R, name_ja: 最終出力 R, source: DELAY_1_OUTPUT_R }

# Controls, listed in the editor's order, each by its entry: a parameter is one entry of NRPN
# category 2 (where it takes its value), the same entry of category 3 (which CC fills its control
# slot) and of category 4 (what its control slot holds while it has no CC); a General control is
# in category 3 only. `cc` is the CC of the default patch, 0 for none, and `value`, as a CC value,
# what that CC powers up at; a parameter's category 4 entry powers up at it too, and the editor's
# Initialize & Send All sets both back to it. A parameter takes its own control slot, off the
# bus, unless `source` (a signal key) says otherwise. `set` is the method of the module that
# takes a parameter's value each buffer. Why the defaults are what they are is above default_order.
controls:
  # EG 1: Release Switch has no CC and holds on, the value 124, the release following the decay;
  # below 64 the release is the shortest decay's, 10 ms. Level has no CC and holds 1.0,
  # passing the envelope as it is.
  - { entry: 0, module: EG_1,      key: ATTACK,       label: Attack,       cc: 73,  value: 4, set: set_attack }
  - { entry: 1, module: EG_1,      key: DECAY,        label: Decay,        cc: 75,  value: 94, set: set_decay }
  - { entry: 2, module: EG_1,      key: SUSTAIN,      label: Sustain,      cc: 30,  value: 124, set: set_sustain }
  - { entry: 3, module: EG_1,      key: RELEASE_SW,   label: Release Switch, cc: 0,   value: 124, set: set_release_switch }
  - { entry: 4, module: EG_1,      key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  # LFO 1 in the editor: the waveform, the rate and its modulation, then the level and its
  # modulation. Wave crossfades Out from the triangle (0.0) to the square (1.0), on CC 33, LFO
  # Wave's in PRA32-U2, and powers up at CC 4, 0.0, the triangle. Each modulation's Amt, listed
  # after what it moves, has no CC and holds 1.0, a depth of 1.0. Rate Mod In is left unrouted, so
  # routing a source to it is enough; Level Mod In takes the mod wheel, which adds to Level
  # (CC 113) up to its top. Level powers up at CC 4, 0.0, so the LFO is still until the wheel
  # moves.
  - { entry: 5, module: LFO_1,     key: WAVE,         label: Wave,         cc: 33,  value: 4, set: set_wave }
  - { entry: 6, module: LFO_1,     key: RATE,         label: Rate,         cc: 3,   value: 64, set: set_rate }
  - { entry: 7, module: LFO_1,     key: RATE_MOD_AMT, label: Rate Mod Amt, cc: 0,   value: 124, set: set_rate_modulation_amount }
  - { entry: 8, module: LFO_1,     key: LEVEL,        label: Level,        cc: 113, value: 4, set: set_level }
  - { entry: 9, module: LFO_1,     key: LEVEL_MOD_AMT, label: Level Mod Amt, cc: 0,  value: 124, set: set_level_modulation_amount }
  # Mixer 1: nothing has a CC; the levels hold 0.0, as the mixer has nothing on its inputs yet,
  # and Out Level holds 0.5, as Mixer 2's powers up.
  - { entry: 10, module: MIXER_1,   key: LEVEL_1,      label: Level 1,      cc: 0,   value: 4, set: set_level_1 }
  - { entry: 11, module: MIXER_1,   key: LEVEL_2,      label: Level 2,      cc: 0,   value: 4, set: set_level_2 }
  - { entry: 12, module: MIXER_1,   key: LEVEL_3,      label: Level 3,      cc: 0,   value: 4, set: set_level_3 }
  - { entry: 13, module: MIXER_1,   key: LEVEL_4,      label: Level 4,      cc: 0,   value: 4, set: set_level_4 }
  - { entry: 14, module: MIXER_1,   key: OUT_LEVEL,  label: Out Level,  cc: 0,   value: 64, set: set_out_level }
  # Pitch 1: Glide is on CC 5, Portamento Time in the MIDI spec, and powers up at CC 4, 0.0, where
  # the portamento is off. Glide Switch has no CC and holds on, the value 124, so Glide alone
  # sets the portamento unless the switch is set off, below 64. Stretch is on CC 22, Stretch
  # Tune's in PRA32-U2, and powers up at CC 4, 0.0, where the keys are as they are. Bend Amt is the
  # bend range, half a semitone a step: CC 8, its power-up value, is 2 semitones either way.
  - { entry: 15, module: PITCH_1,   key: GLIDE,        label: Glide,        cc: 5, value: 4, set: set_glide }
  - { entry: 16, module: PITCH_1,   key: GLIDE_SW,     label: Glide Switch, cc: 0,  value: 124, set: set_glide_switch }
  - { entry: 17, module: PITCH_1,    key: STRETCH, label: Stretch, cc: 22,  value: 4, set: set_stretch }
  - { entry: 18, module: PITCH_1,    key: BEND_AMT,  label: Bend Amt,   cc: 57,  value: 8, set: set_bend_amount }
  # Osc 1 in the editor: the waveform, the pitch, how far each modulation moves it and what the
  # top of that is worth, then the pulse width and how far each modulation moves it. Pitch Coarse
  # and Fine have no CC and stay at 0.0. Mod 1 In takes the envelope and Mod 2 In the LFO, and
  # every depth is unipolar: a modulation runs the way its source does, and one the other way up
  # takes an inverted source, such as EG 1 Out Inv. Pitch Mod 1 Amt and Pitch Mod 2 Amt are on
  # CC 89 and 13, EG Mod Amt's and LFO Mod Amt's in PRA32-U2, and PW Mod 1 Amt and PW Mod 2 Amt
  # on CC 8 and 103, EG Mod Dst's and LFO Mod Dst's. Pitch Mod 2 Amt powers up at CC 9, a vibrato
  # of 50 cents either way at full LFO level, as a GM2 sound module's Modulation Depth Range does,
  # and the other three at CC 4, 0.0. Pitch Mod Range has no CC and holds 0.2, the depth at the top
  # of a Pitch Mod Amt, which brings the LFO down to a vibrato depth and the envelope to two
  # octaves; a step of a Pitch Mod Amt is then 10 cents of the LFO. Wave is on
  # CC 102 and powers up at the saw. PW is bipolar and powers up at CC 64, 0.0, a pulse of 50%.
  - { entry: 19, module: OSC_1,     key: WAVE,     label: Wave,         cc: 102, value: 4, set: set_waveform }
  - { entry: 20, module: OSC_1,     key: PITCH_COARSE,  label: Pitch Coarse,  cc: 0,   value: 64, bipolar: true, set: set_pitch_coarse }
  - { entry: 21, module: OSC_1,     key: PITCH_FINE,    label: Pitch Fine,    cc: 0,   value: 64, bipolar: true, set: set_pitch_fine }
  - { entry: 22, module: OSC_1,     key: PITCH_MOD_1_AMT, label: Pitch Mod 1 Amt, cc: 89, value: 4, set: set_pitch_modulation_1_amount }
  - { entry: 23, module: OSC_1,     key: PITCH_MOD_2_AMT, label: Pitch Mod 2 Amt, cc: 13, value: 9, set: set_pitch_modulation_2_amount }
  - { entry: 24, module: OSC_1,     key: PITCH_MOD_RANGE, label: Pitch Mod Range, cc: 0, value: 28, set: set_pitch_modulation_range }
  - { entry: 25, module: OSC_1,     key: PW,           label: PW,  cc: 114, value: 64, bipolar: true, set: set_pulse_width }
  - { entry: 26, module: OSC_1,     key: PW_MOD_1_AMT, label: PW Mod 1 Amt,  cc: 8,   value: 4, set: set_pw_modulation_1_amount }
  - { entry: 27, module: OSC_1,     key: PW_MOD_2_AMT, label: PW Mod 2 Amt,  cc: 103, value: 4, set: set_pw_modulation_2_amount }
  # Osc 2: Pitch Coarse and Fine are its own, on CC 85 and 76, to tune it against Osc 1: Coarse
  # powers up at CC 64, in unison, and Fine at CC 76, 12 cents sharp, for a slow beat once Osc 2
  # is turned up. Wave is its own too, on CC 104 next to Osc 1's on CC 102, sawtooth at power-up as
  # Osc 1's is. Everything else follows Osc 1 by default: each Mod Amt and PW are on Osc 1's CCs,
  # so one CC moves both oscillators, and Pitch Mod Range holds the
  # value Osc 1's does. Osc 2 is heard through Mixer 2 Level 2 (CC 21), which powers up at 0.7, as
  # Level 1 does for Osc 1.
  - { entry: 28, module: OSC_2,     key: WAVE,     label: Wave,         cc: 104, value: 4, set: set_waveform }
  - { entry: 29, module: OSC_2,     key: PITCH_COARSE,  label: Pitch Coarse,  cc: 85,  value: 64, bipolar: true, set: set_pitch_coarse }
  - { entry: 30, module: OSC_2,     key: PITCH_FINE,    label: Pitch Fine,    cc: 76,  value: 76, bipolar: true, set: set_pitch_fine }
  - { entry: 31, module: OSC_2,     key: PITCH_MOD_1_AMT, label: Pitch Mod 1 Amt, cc: 89, value: 4, set: set_pitch_modulation_1_amount }
  - { entry: 32, module: OSC_2,     key: PITCH_MOD_2_AMT, label: Pitch Mod 2 Amt, cc: 13, value: 9, set: set_pitch_modulation_2_amount }
  - { entry: 33, module: OSC_2,     key: PITCH_MOD_RANGE, label: Pitch Mod Range, cc: 0, value: 28, set: set_pitch_modulation_range }
  - { entry: 34, module: OSC_2,     key: PW,           label: PW,  cc: 114, value: 64, bipolar: true, set: set_pulse_width }
  - { entry: 35, module: OSC_2,     key: PW_MOD_1_AMT, label: PW Mod 1 Amt,  cc: 8,   value: 4, set: set_pw_modulation_1_amount }
  - { entry: 36, module: OSC_2,     key: PW_MOD_2_AMT, label: PW Mod 2 Amt,  cc: 103, value: 4, set: set_pw_modulation_2_amount }
  # Noise 1: Color crossfades Out from the white (0.0) to the red (1.0), on CC 115, and powers up
  # at CC 4, 0.0, the white. Level has no CC and holds 1.0: the noise runs at full level, and
  # Mixer 2 Level 3 (CC 23), or the depth of what it modulates, sets how much is heard.
  - { entry: 37, module: NOISE_1,   key: COLOR,        label: Color,        cc: 115, value: 4, set: set_color }
  - { entry: 38, module: NOISE_1,   key: LEVEL,        label: Level,        cc: 0,   value: 124, set: set_level }
  # Mixer 2, the audio ahead of the filter: Osc 1 on In 1, Osc 2 on In 2 and the noise on In 3.
  # Level 1 and 2 (CC 20 and 21) power up at CC 88, 0.7: two saws 12 cents apart come out about
  # as loud as one at 1.0, as 0.7 is about one over the square root of 2. Level 3 (CC 23) powers up
  # at 0.0, leaving the noise, at full level from Noise 1, silent. Level 4 has no CC and
  # holds 0.0, In 4 being left unrouted. Out Level has no CC and holds 0.5: how
  # hard the sum drives the filter, the one Mixer 2 feeds, and what keeps two oscillators and the
  # noise all at full level, a sum of 1.5 at most, inside the mixer's range.
  - { entry: 39, module: MIXER_2,   key: LEVEL_1,      label: Level 1,      cc: 20,  value: 88, set: set_level_1 }
  - { entry: 40, module: MIXER_2,   key: LEVEL_2,      label: Level 2,      cc: 21,  value: 88, set: set_level_2 }
  - { entry: 41, module: MIXER_2,   key: LEVEL_3,      label: Level 3,      cc: 23,  value: 4, set: set_level_3 }
  - { entry: 42, module: MIXER_2,   key: LEVEL_4,      label: Level 4,      cc: 0,   value: 4, set: set_level_4 }
  - { entry: 43, module: MIXER_2,   key: OUT_LEVEL,  label: Out Level,  cc: 0,   value: 64, set: set_out_level }
  # Filter 1 in the editor: Mode, the cutoff, its keyboard tracking and its two modulations,
  # then the resonance. Pitch In takes the pitch from Pitch 1, as Osc 1 Pitch In does, and
  # Pitch Amt (CC 9) at its top makes the cutoff follow the note a semitone for a
  # semitone, unmoved at note 60; it powers up at CC 4, 0.0, with the tracking off. Mod 1 Amt and
  # Mod 2 Amt, on CC 24 and 25, Filter EG Amt's and LFO Filter Amt's in PRA32-U2, are how far the
  # envelope on Mod 1 In and the LFO on Mod 2 In move the cutoff, as Osc 1's PW Mod Amts are for
  # the pulse width. Mod 1 Amt powers up at CC 28, 0.2, and Mod 2 Amt at CC 4, 0.0, so the LFO
  # leaves the cutoff alone until it is turned up. A modulation that closes the filter takes an
  # inverted source, such as EG 1 Out Inv. Mode crossfades Out from the low pass (0.0) through a
  # notch (0.5) to the high pass (1.0), on CC 39, Filter Mode's in PRA32-U2, and powers up at CC 4,
  # 0.0, the low pass.
  - { entry: 44, module: FILTER_1,  key: MODE,         label: Mode,         cc: 39,  value: 4, set: set_mode }
  - { entry: 45, module: FILTER_1,  key: CUTOFF,       label: Cutoff,       cc: 74,  value: 100, set: set_cutoff }
  - { entry: 46, module: FILTER_1,  key: PITCH_AMT, label: Pitch Amt, cc: 9, value: 4, set: set_pitch_amount }
  - { entry: 47, module: FILTER_1,  key: MOD_1_AMT,    label: Mod 1 Amt,    cc: 24,  value: 28, set: set_modulation_1_amount }
  - { entry: 48, module: FILTER_1,  key: MOD_2_AMT,    label: Mod 2 Amt,    cc: 25,  value: 4, set: set_modulation_2_amount }
  - { entry: 49, module: FILTER_1,  key: RESONANCE,    label: Resonance,    cc: 71,  value: 94, set: set_resonance }
  # Amp 1: Gain, on CC 15, Amp Gain's in PRA32-U2, is doubled, so it powers up at CC 64, a gain of
  # 1.0, and CC 124 brings the sound up by 6 dB; the amp holds its output to one unit.
  - { entry: 50, module: AMP_1,     key: GAIN,         label: Gain,         cc: 15,  value: 64, set: set_gain }
  - { entry: 51, module: CHORUS_1,  key: MIX,          label: Mix,          cc: 93,  value: 64, set: set_mix }
  - { entry: 52, module: CHORUS_1,  key: RATE,         label: Rate,         cc: 0,   value: 64, set: set_rate }
  - { entry: 53, module: CHORUS_1,  key: DEPTH,        label: Depth,        cc: 0,   value: 64, set: set_depth }
  - { entry: 54, module: DELAY_1,   key: MIX,          label: Mix,          cc: 94,  value: 34, set: set_mix }
  - { entry: 55, module: DELAY_1,   key: TIME,         label: Time,         cc: 90,  value: 64, set: set_time }
  - { entry: 56, module: DELAY_1,   key: FEEDBACK,     label: Feedback,     cc: 0,   value: 64, set: set_feedback }

  # General controls: a CC put on the bus for any input or parameter to read, the mod wheel
  # unipolar and each of General 1-4 filling a unipolar and a bipolar slot (see `signals`). Each
  # of General 1-4 powers up at CC 64, the one value that puts neither slot at an end: the
  # unipolar slot at 0.5, the bipolar at 0.0. General 1-4 are on CC 16-19, the MIDI spec's
  # General Purpose Controllers 1-4.
  - { entry: 57, general: true, key: GENERAL_MOD_WHEEL, label: Mod Wheel, cc: 1,   value: 4 }
  - { entry: 58, general: true, key: GENERAL_1,         label: "1",       cc: 16,  value: 64 }
  - { entry: 59, general: true, key: GENERAL_2,         label: "2",       cc: 17,  value: 64 }
  - { entry: 60, general: true, key: GENERAL_3,         label: "3",       cc: 18,  value: 64 }
  - { entry: 61, general: true, key: GENERAL_4,         label: "4",       cc: 19,  value: 64 }
