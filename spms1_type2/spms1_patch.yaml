# MIDI Synthesizer SPMS-1 (type-2): the patch, as data
#
# Every number a patch is made of -- module ids, bus slots, NRPN entries -- and the default patch,
# in one place. patch_gen/spms1_patch_gen.rb writes what the rest of the sketch reads from here:
#
#   spms1/spms1_patch.rb  the constants and the default patch, for spms1_main.rb
#   spms1/spms1_default_patch.h
#                         the default patch again, for Reset, and what a saved patch is checked
#                         against and keeps, for spms1_midi_state.h
#   spms1_editor.html     the tables of the editor, between its "patch_gen" markers
#   spms1_patching.md     the NRPN tables, between the "patch_gen" markers, and spms1_patching.ja.md
#                         likewise
#   spms1/spms1_main.rb   the wiring of the loop, between its "patch_gen" markers: the module
#                         instances, the routing and CC reads, the setters and the dispatch
#
# Run `ruby patch_gen/spms1_patch_gen.rb` after a change here, and commit what it writes;
# `--check` says whether that is needed, as the GitHub Actions workflow does.
#
# Every list is numbered in its order, from 0 (from 1 for the modules), with no gaps, which
# patch_gen checks: the modules in the default run order; on the bus the constants, then what
# comes from MIDI, then each module's outputs, module by module in that order, its main output
# first; the inputs and the controls module by module in the same order, the final output's sides
# last among the inputs and the controllers, the mod wheel and the general controls, last among the
# controls. Something added goes where it belongs and the numbers after it move up, so a patch
# sent as NRPN bytes, which names everything by number, is for the version it was made for; the editor saves a patch by name and
# reads it into any version. Each number is still written out, so that a renumbering shows;
# `ruby patch_gen/spms1_patch_gen.rb --renumber` writes them again from the order of the lists.
#
# Labels: `label` is what the documents and the editor call a thing. Where the Japanese ones call
# it otherwise, `label_ja` says so.

# The version of what a saved patch means, beyond its numbers. A patch saved in the flash (NRPN
# Save) is loaded at power-on only by a sketch whose numbers -- module ids, bus slots, NRPN entries
# -- and this version are those it was saved with (SPMS1_PATCH_SPEC_HASH, which patch_gen works out
# from them); any other loads the default patch instead. The numbers are checked by themselves, so
# raise this only when a change keeps them but makes a saved patch sound otherwise, as turning a
# parameter's range round would.
saved_patch_version: 1

# Module ids (NRPN category 0 values). 0 is MODULE_NONE, which ends the run order. A module with
# `stereo` writes a left and a right output. `class` is the Ruby class of the module, and `process`
# the inputs its process method takes after the control tick, in order, by their keys below;
# `method`, where given, is the method the loop calls in place of process, with the same inputs. The
# loop is written from these (see patch_gen/spms1_patch_gen.rb).
modules:
  - { key: PITCH_1,    id: 1, label: Pitch 1, class: Pitch, process: [PITCH_IN, GATE_IN, BEND_IN] }
  - { key: EG_1, id: 2, label: EG 1, class: EnvGen, process: [GATE_IN] }
  - { key: EG_2, id: 3, label: EG 2, class: EnvGen, process: [GATE_IN] }
  - { key: LFO_1,     id: 4, label: LFO 1, class: LFO, process: [RATE_MOD_IN, LEVEL_MOD_IN, RESET_IN] }
  - { key: MIXER_1,   id: 5, label: Mixer 1, class: Mixer, process: [IN_1, IN_2, IN_3, IN_4] }
  - { key: OSC_1,     id: 6, label: Osc 1, class: Osc, process: [PITCH_IN, MOD_1_IN, MOD_2_IN] }
  - { key: OSC_2,      id: 7, label: Osc 2, class: Osc, method: process_synced, process: [PITCH_IN, MOD_1_IN, MOD_2_IN, SYNC_IN] }
  - { key: NOISE_1,    id: 8, label: Noise 1, class: Noise, process: [] }
  - { key: MIXER_2,    id: 9, label: Mixer 2, class: Mixer, process: [IN_1, IN_2, IN_3, IN_4] }
  - { key: FILTER_1,  id: 10, label: Filter 1, class: Filter, process: [AUDIO_IN, PITCH_IN, MOD_1_IN, MOD_2_IN] }
  - { key: AMP_1,     id: 11, label: Amp 1, class: Amp, process: [AUDIO_IN, MOD_1_IN, MOD_2_IN] }
  - { key: CHORUS_1,  id: 12, label: Chorus 1, stereo: true, class: Chorus, process: [AUDIO_IN] }
  - { key: DELAY_1,   id: 13, label: Delay 1,  stereo: true, class: Delay, process: [AUDIO_IN_L, AUDIO_IN_R] }

# The default patch. Every module is in the run order, so a patch only ever has to route, never to
# switch something on first. Pitch 1 runs first, taking Note Pitch and handing it to the
# oscillators, Out 1 to Osc 1 and the filter and Out 2 to Osc 2: its Glide powers up at 0.0, where it passes its input through as it
# is, so the patch plays as one without it until CC 5 turns the portamento up, and its Gate In
# takes Note Gate, so that the glide moves only while a key is held. Pitch Bend goes to
# its Bend In, added past the glide, an octave either way at Bend Amt's (CC 57) power-up of CC 28, so
# the bend reaches the oscillators and the filter's keyboard tracking at once. Running first lets
# every other module read it in the same sample, the modulation sources as well as the
# oscillators and the filter, as a key-tracked envelope or LFO would; what it takes from them
# instead comes a sample late. Mixer 1 runs after the modulation sources and ahead of the oscillators, so
# it sees this sample's LFO and envelopes and can feed the oscillators, the filter and the amp
# without a sample's delay. The default patch leaves it unused: the LFO goes straight to the
# oscillator, on Mod 2 In: Pitch Mod 2 Amt (CC 13) powers up at 0.0, and at its top, with Osc 1
# Pitch Mod 2 Pol at +0.2, the LFO at full level swings the pitch an octave either way. The LFO
# itself powers up at Level 1.0, so CC 13 alone sets the vibrato's depth. PW Mod 2 Amt, on CC 103,
# takes the LFO to the pulse width and powers up at 0.0. Osc 1 Pitch In takes the note from
# Pitch 1 whole, in tune. Osc 1 Mod 1 In takes EG 1, for a pitch envelope, but Pitch Mod 1
# Amt (CC 89) and PW Mod 1 Amt (CC 8) power up at 0.0 too. EG 1 and the LFO also reach
# Filter 1 Mod 1 In and Mod 2 In: Filter 1 Mod 1 Amt (CC 24) powers up at 0.2, so the envelope
# opens the cutoff two octaves above where Cutoff (CC 74), at 0.8, puts it, and Mod 2 Amt (CC 25)
# at 0.0, so the LFO leaves the cutoff alone until CC 25 turns it up.
# Filter 1 Pitch In takes Pitch 1's pitch too, for keyboard tracking, and Filter 1 Pitch Amt
# (CC 9) powers up at 0.0, the cutoff staying where Cutoff puts it whatever the note. Noise 1 runs after the oscillators, as it is mostly a sound of its own (a modulation taking
# it is a sample late, which it does not hear), at full level: its Level has no CC and holds 1.0.
# Mixer 2 runs after it, just ahead of the filter, which it feeds: Osc 1 on its In 1, Osc 2 on In 2,
# Osc 1's sub on In 3 and the noise on In 4. Its Level 1 and 2, on CC 19 and 20, power up at 0.7,
# so the two oscillators sound together about as loud as one at full level, and Level 4, on CC 23,
# at 0.0, so the noise is silent until CC 23. Osc 2 plays the note from Pitch 1, as Osc 1 does, tuned by its own
# Pitch and Pitch Fine (CC 85 and 76), 11 cents sharp at power-up, and has a Wave of its own on CC
# 104 (Osc 1's on CC 102); it follows Osc 1 in everything else: each of its Mod Amts and its PW
# are on Osc 1's CCs, so one CC moves both. Osc 2 Sync In takes Osc 1 Out Saw, for hard sync, but
# Osc 2 Sync Sw, on CC 112, powers up off, so it runs free until CC 112; LFO 1 Reset In takes
# Note Gate, for key sync, but LFO 1 Reset Sw, on CC 113, powers up off, so the LFO runs free
# too until CC 113. Mixer 1 has no CC, its levels holding 0.0, so its
# inputs start closed, and Mixer 2 Level 3, on CC 21, powers up at 0.0. Each mixer's Out Level has no
# CC and holds 0.5, which keeps two full-scale signals and a third at half inside its range;
# Mixer 2's also sets how hard the audio drives the filter. EG 2, on Note Gate too, is an organ's
# envelope at power-up, Attack and Decay at 0.0 and Sustain at 1.0 (CC 52, 53 and 54), its Release
# Sw on EG 1's CC 105: Amp 1 Mod 1 In takes EG 1 and Mod 2 In EG 2, and Mod 1/2 Mix (CC 36)
# powers up at 0.0, so the amp follows EG 1 until CC 36 hands it to EG 2. EG 1, EG 2, LFO 1 and
# the mixers each put out an inverted output as well, Out Inv, which the default patch leaves
# unrouted. LFO 1 Level is on
# CC 116 and powers up at 1.0, and the mod wheel on its Level Mod In adds to it up to 1.0; EG 1
# Level has no CC and holds 1.0, passing the envelope as it is. The chorus and the delay run last,
# after the amp: the chorus takes the mono amp and spreads it into a left and a right, the delay
# takes the two sides, and its two outputs are what the final output's left and right read.
#
# The run order of the default patch, the order of the module ids too. Pitch 1 runs first, so that
# everything after it reads the note in the same sample, and the envelopes ahead of the LFO, so that
# the LFO's Mod Ins can read them in the same sample, as for a vibrato that fades in.
default_order: [PITCH_1, EG_1, EG_2, LFO_1, MIXER_1, OSC_1, OSC_2, NOISE_1, MIXER_2, FILTER_1, AMP_1, CHORUS_1, DELAY_1]

# Slots of the signal bus (the values of NRPN categories 1 and 2), each one of:
#   value:    a constant, which the bus holds from startup; `short` is the editor's label for it
#   output:   a module output, `module` writing it, `output` its label on the module in the editor;
#             `get` the method that reads it after process, or none for the one process returns
#   control:  a controller's slot, which the CC of that control (below) fills; `form` makes it a
#             shape of that CC's value u, 0.0 to 1.0: rev 1 - u, inv -u, rev_inv u - 1, bipolar
#             u - 0.5, bipolar_inv 0.5 - u, sin sin(u * pi / 2), cos cos(u * pi / 2), lo
#             min(1, 2 - 2u), hi min(1, 2u), neg max(0, 1 - 2u), mid 1 - |2u - 1| and
#             pos max(0, 2u - 1), each labeled by `label`; with no form it is u itself
#   (none):   a note input, written by the synth from MIDI
# `bipolar` marks a slot that swings both ways (the documents' ±); a controller slot takes its
# control's.
#
# 127 is not a slot: as a parameter's source it means the parameter's own control slot, which
# holds the value of its CC off the bus (see spms1_main.rb), so no other input or parameter can
# read it.
signals:
  # The constants, from the top down. NONE is 0, what an NRPN entry nobody has set reads, so that
  # an unrouted input is silent.
  - { key: NONE,            id: 0, value: 0.0,  short: "0.0",  label: None (constant 0.0), label_ja: なし（定数 0.0） }
  - { key: ONE,             id: 1, value: 1.0,  short: "+1.0", label: Constant 1.0,  label_ja: 定数 1.0 }
  - { key: HALF,            id: 2, value: 0.5,  short: "+0.5", label: Constant 0.5,  label_ja: 定数 0.5 }
  - { key: MINUS_HALF,      id: 3, value: -0.5, short: "-0.5", label: Constant -0.5, label_ja: 定数 -0.5 }
  - { key: MINUS_ONE,       id: 4, value: -1.0, short: "-1.0", label: Constant -1.0, label_ja: 定数 -1.0 }

  # From MIDI: the note, the bend and the mod wheel.
  - { key: NOTE_PITCH, id: 5, label: Note Pitch, bipolar: true }
  - { key: NOTE_GATE,  id: 6, label: Note Gate }
  - { key: PITCH_BEND, id: 7, label: Pitch Bend, bipolar: true }
  # The mod wheel, a control slot no parameter owns: its CC put on the bus, unipolar, for any
  # input or parameter to read, and in three more shapes: turned round, negated, and both.
  - { key: MOD_WHEEL,  id: 8, control: MOD_WHEEL }
  - { key: MOD_WHEEL_REV,     id: 9, control: MOD_WHEEL, form: rev,     label: Mod Wheel Rev }
  - { key: MOD_WHEEL_INV,     id: 10, control: MOD_WHEEL, form: inv,     label: Mod Wheel Inv }
  - { key: MOD_WHEEL_REV_INV, id: 11, control: MOD_WHEEL, form: rev_inv, label: Mod Wheel Rev Inv }
  # The general controls, General 1 and 2, each a CC put on the bus as it is and in twelve more
  # shapes: turned round, negated, both, centered on zero either way up, a quarter sine and
  # cosine, an equal-power pair: two levels taking Sin and Cos crossfade with no dip in the
  # middle, each at 0.707 at CC 64, as their squares sum to one everywhere; Lo and Hi, the pair
  # Filter 1 Mode crossfades by, each at 1.0 over its own half and falling to 0.0 over the other;
  # Neg and Pos, the two sides of Bipolar doubled, 0.0 in the middle and rising to 1.0 at either
  # end; and Mid, 1.0 in the middle and 0.0 at both ends, which with Neg and Pos crossfades
  # three things on one knob. A parameter taking one smooths it, as it does its CC, and a
  # module input but a gate input takes a smoothed copy (see spms1_main.rb). A switch or a
  # parameter taking Rev moves the other way from one taking the CC itself, so one CC can turn a
  # switch on while it turns another off.
  - { key: GENERAL_1,             id: 12, control: GENERAL_1 }
  - { key: GENERAL_1_REV,         id: 13, control: GENERAL_1, form: rev,         label: General 1 Rev }
  - { key: GENERAL_1_INV,         id: 14, control: GENERAL_1, form: inv,         label: General 1 Inv }
  - { key: GENERAL_1_REV_INV,     id: 15, control: GENERAL_1, form: rev_inv,     label: General 1 Rev Inv }
  - { key: GENERAL_1_BIPOLAR,     id: 16, control: GENERAL_1, form: bipolar,     label: General 1 Bipolar, bipolar: true }
  - { key: GENERAL_1_BIPOLAR_INV, id: 17, control: GENERAL_1, form: bipolar_inv, label: General 1 Bipolar Inv, bipolar: true }
  - { key: GENERAL_1_SIN,         id: 18, control: GENERAL_1, form: sin,         label: General 1 Sin }
  - { key: GENERAL_1_COS,         id: 19, control: GENERAL_1, form: cos,         label: General 1 Cos }
  - { key: GENERAL_1_LO,          id: 20, control: GENERAL_1, form: lo,          label: General 1 Lo }
  - { key: GENERAL_1_HI,          id: 21, control: GENERAL_1, form: hi,          label: General 1 Hi }
  - { key: GENERAL_1_NEG,         id: 22, control: GENERAL_1, form: neg,         label: General 1 Neg }
  - { key: GENERAL_1_MID,         id: 23, control: GENERAL_1, form: mid,         label: General 1 Mid }
  - { key: GENERAL_1_POS,         id: 24, control: GENERAL_1, form: pos,         label: General 1 Pos }
  - { key: GENERAL_2,             id: 25, control: GENERAL_2 }
  - { key: GENERAL_2_REV,         id: 26, control: GENERAL_2, form: rev,         label: General 2 Rev }
  - { key: GENERAL_2_INV,         id: 27, control: GENERAL_2, form: inv,         label: General 2 Inv }
  - { key: GENERAL_2_REV_INV,     id: 28, control: GENERAL_2, form: rev_inv,     label: General 2 Rev Inv }
  - { key: GENERAL_2_BIPOLAR,     id: 29, control: GENERAL_2, form: bipolar,     label: General 2 Bipolar, bipolar: true }
  - { key: GENERAL_2_BIPOLAR_INV, id: 30, control: GENERAL_2, form: bipolar_inv, label: General 2 Bipolar Inv, bipolar: true }
  - { key: GENERAL_2_SIN,         id: 31, control: GENERAL_2, form: sin,         label: General 2 Sin }
  - { key: GENERAL_2_COS,         id: 32, control: GENERAL_2, form: cos,         label: General 2 Cos }
  - { key: GENERAL_2_LO,          id: 33, control: GENERAL_2, form: lo,          label: General 2 Lo }
  - { key: GENERAL_2_HI,          id: 34, control: GENERAL_2, form: hi,          label: General 2 Hi }
  - { key: GENERAL_2_NEG,         id: 35, control: GENERAL_2, form: neg,         label: General 2 Neg }
  - { key: GENERAL_2_MID,         id: 36, control: GENERAL_2, form: mid,         label: General 2 Mid }
  - { key: GENERAL_2_POS,         id: 37, control: GENERAL_2, form: pos,         label: General 2 Pos }

  # The module outputs, module by module, each module's main output first.
  - { key: PITCH_1_OUTPUT_1, id: 38, module: PITCH_1, output: Out 1, label: Pitch 1 Output 1, bipolar: true }
  - { key: PITCH_1_OUTPUT_2, id: 39, module: PITCH_1, output: Out 2, label: Pitch 1 Output 2, bipolar: true, get: output_2 }
  - { key: EG_1_OUTPUT,        id: 40, module: EG_1,     output: Out,    label: EG 1 Output }
  # Out Inv, of the envelopes, the LFO and the mixers, is Out negated.
  - { key: EG_1_OUTPUT_INV,    id: 41, module: EG_1,     output: Out Inv, label: EG 1 Output Inv, get: output_inverted }
  - { key: EG_2_OUTPUT,        id: 42, module: EG_2,     output: Out,    label: EG 2 Output }
  - { key: EG_2_OUTPUT_INV,    id: 43, module: EG_2,     output: Out Inv, label: EG 2 Output Inv, get: output_inverted }
  # Out is the triangle and the square crossfaded by Wave; each of the three has its inverted output
  # beside it. The square is unipolar, 0.0 and 1.0, and its inverted output 0.0 and -1.0.
  - { key: LFO_1_OUTPUT,       id: 44, module: LFO_1,    output: Out,    label: LFO 1 Output,       bipolar: true }
  - { key: LFO_1_OUTPUT_INV,   id: 45, module: LFO_1,    output: Out Inv, label: LFO 1 Output Inv,  bipolar: true, get: output_inverted }
  - { key: LFO_1_OUTPUT_TRIANGLE, id: 46, module: LFO_1, output: Out Triangle, label: LFO 1 Output Triangle, bipolar: true, get: output_triangle }
  - { key: LFO_1_OUTPUT_TRIANGLE_INV, id: 47, module: LFO_1, output: Out Triangle Inv, label: LFO 1 Output Triangle Inv, bipolar: true, get: output_triangle_inverted }
  - { key: LFO_1_OUTPUT_SQUARE,   id: 48, module: LFO_1, output: Out Square,   label: LFO 1 Output Square,   get: output_square }
  - { key: LFO_1_OUTPUT_SQUARE_INV, id: 49, module: LFO_1, output: Out Square Inv, label: LFO 1 Output Square Inv, get: output_square_inverted }
  - { key: MIXER_1_OUTPUT,     id: 50, module: MIXER_1,  output: Out,    label: Mixer 1 Output,     bipolar: true }
  - { key: MIXER_1_OUTPUT_INV,   id: 51, module: MIXER_1,  output: Out Inv, label: Mixer 1 Output Inv, bipolar: true, get: output_inverted }
  # Each oscillator's Out is the morph from the saw to the pulse, by Wave.
  - { key: OSC_1_OUTPUT,       id: 52, module: OSC_1,    output: Out,    label: Osc 1 Output,       bipolar: true }
  - { key: OSC_1_OUTPUT_SAW,   id: 53, module: OSC_1, output: Out Saw,   label: Osc 1 Output Saw,   bipolar: true, get: output_saw }
  - { key: OSC_1_OUTPUT_PULSE, id: 54, module: OSC_1, output: Out Pulse, label: Osc 1 Output Pulse, bipolar: true, get: output_pulse }
  - { key: OSC_1_OUTPUT_SUB,   id: 55, module: OSC_1, output: Out Sub,   label: Osc 1 Output Sub,   bipolar: true, get: output_sub }
  - { key: OSC_2_OUTPUT,         id: 56, module: OSC_2,   output: Out,       label: Osc 2 Output,         bipolar: true }
  - { key: OSC_2_OUTPUT_SAW,   id: 57, module: OSC_2, output: Out Saw,   label: Osc 2 Output Saw,   bipolar: true, get: output_saw }
  - { key: OSC_2_OUTPUT_PULSE, id: 58, module: OSC_2, output: Out Pulse, label: Osc 2 Output Pulse, bipolar: true, get: output_pulse }
  # Out is the white and the red crossfaded by Color.
  - { key: NOISE_1_OUTPUT,       id: 59, module: NOISE_1, output: Out,       label: Noise 1 Output,       bipolar: true }
  - { key: NOISE_1_OUTPUT_WHITE, id: 60, module: NOISE_1, output: Out White, label: Noise 1 Output White, bipolar: true, get: output_white }
  - { key: NOISE_1_OUTPUT_RED,   id: 61, module: NOISE_1, output: Out Red,   label: Noise 1 Output Red,   bipolar: true, get: output_red }
  - { key: MIXER_2_OUTPUT,       id: 62, module: MIXER_2, output: Out,      label: Mixer 2 Output,       bipolar: true }
  - { key: MIXER_2_OUTPUT_INV,   id: 63, module: MIXER_2,  output: Out Inv, label: Mixer 2 Output Inv, bipolar: true, get: output_inverted }
  # Out is the low pass and the high pass crossfaded by Mode, through a notch.
  - { key: FILTER_1_OUTPUT,    id: 64, module: FILTER_1, output: Out,    label: Filter 1 Output,    bipolar: true }
  - { key: FILTER_1_OUTPUT_LP, id: 65, module: FILTER_1, output: Out LP, label: Filter 1 Output LP, bipolar: true, get: output_lp }
  - { key: FILTER_1_OUTPUT_HP, id: 66, module: FILTER_1, output: Out HP, label: Filter 1 Output HP, bipolar: true, get: output_hp }
  - { key: FILTER_1_OUTPUT_BP, id: 67, module: FILTER_1, output: Out BP, label: Filter 1 Output BP, bipolar: true, get: output_bp }
  - { key: AMP_1_OUTPUT,       id: 68, module: AMP_1,    output: Out,    label: Amp 1 Output,       bipolar: true }
  # Out Mono, of the chorus and of the delay, is the average of the two sides, a sub output.
  - { key: CHORUS_1_OUTPUT_L,  id: 69, module: CHORUS_1, output: Out L,  label: Chorus 1 Output L,  bipolar: true, get: output_l }
  - { key: CHORUS_1_OUTPUT_R,  id: 70, module: CHORUS_1, output: Out R,  label: Chorus 1 Output R,  bipolar: true, get: output_r }
  - { key: CHORUS_1_OUTPUT_MONO, id: 71, module: CHORUS_1, output: Out Mono, label: Chorus 1 Output Mono, bipolar: true, get: output_mono }
  - { key: DELAY_1_OUTPUT_L,   id: 72, module: DELAY_1,  output: Out L,  label: Delay 1 Output L,   bipolar: true, get: output_l }
  - { key: DELAY_1_OUTPUT_R,   id: 73, module: DELAY_1,  output: Out R,  label: Delay 1 Output R,   bipolar: true, get: output_r }
  - { key: DELAY_1_OUTPUT_MONO,  id: 74, module: DELAY_1,  output: Out Mono, label: Delay 1 Output Mono,  bipolar: true, get: output_mono }

# Module inputs, NRPN category 1, listed in the editor's order, each by its entry: what feeds each
# one in the default patch (`source`, a signal key). `label` is the editor's, on the module; `name`
# the documents', after the module's label. An input with no module is a side of the final output.
# A module input that takes a general control or the mod wheel reads it smoothed, from a copy off
# the bus (see spms1_main.rb), but for one marked `gate`, which acts at a threshold or an edge and
# takes the slot as it is.
inputs:
  - { entry: 0, module: PITCH_1,      key: PITCH_IN,       label: Pitch In,       name: Pitch In,       source: NOTE_PITCH }
  - { entry: 1, module: PITCH_1,      key: GATE_IN,        label: Gate In,      name: Gate In,      source: NOTE_GATE, gate: true }
  - { entry: 2, module: PITCH_1,      key: BEND_IN,        label: Bend In,      name: Bend In,      source: PITCH_BEND }
  - { entry: 3, module: EG_1,        key: GATE_IN,        label: Gate In,        name: Gate In,        source: NOTE_GATE, gate: true }
  - { entry: 4, module: EG_2,        key: GATE_IN,        label: Gate In,        name: Gate In,        source: NOTE_GATE, gate: true }
  - { entry: 5, module: LFO_1,       key: RATE_MOD_IN,    label: Rate Mod In,    name: Rate Mod In,    source: NONE }
  - { entry: 6, module: LFO_1,       key: LEVEL_MOD_IN,   label: Level Mod In,   name: Level Mod In,   source: MOD_WHEEL }
  - { entry: 7, module: LFO_1,       key: RESET_IN,       label: Reset In,       name: Reset In,       source: NOTE_GATE, gate: true }
  - { entry: 8, module: MIXER_1,     key: IN_1,        label: In 1,           name: In 1,           source: NONE }
  - { entry: 9, module: MIXER_1,     key: IN_2,        label: In 2,           name: In 2,           source: NONE }
  - { entry: 10, module: MIXER_1,     key: IN_3,        label: In 3,           name: In 3,           source: NONE }
  - { entry: 11, module: MIXER_1,     key: IN_4,        label: In 4,           name: In 4,           source: NONE }
  - { entry: 12, module: OSC_1,       key: PITCH_IN,       label: Pitch In,       name: Pitch In,       source: PITCH_1_OUTPUT_1 }
  - { entry: 13, module: OSC_1,       key: MOD_1_IN,       label: Mod 1 In,       name: Mod 1 In,       source: EG_1_OUTPUT }
  - { entry: 14, module: OSC_1,       key: MOD_2_IN,       label: Mod 2 In,   name: Mod 2 In,   source: LFO_1_OUTPUT }
